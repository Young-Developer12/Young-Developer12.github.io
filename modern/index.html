<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>MODERN HUD</title>
    <meta http-equiv='X-UA-Compatible' content='ie=edge'>
    <link href="https://fonts.googleapis.com/css?family=Montserrat:100,200,300,400,500,600,700" rel="stylesheet">
    <style>
        /* ===== RESET & BASE ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            user-select: none;
            background: transparent !important;
            font-family: 'Montserrat', sans-serif;
        }

        /* ===== HUD CONTAINER ===== */
        .modern-cefstudio {
            position: relative;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            visibility: visible;
        }

        /* ===== TOP RIGHT BLOCK ===== */
        .top-logo-block {
            position: absolute;
            top: 0;
            right: 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 0.1vh;
            width: max-content;
            padding: 0.5vh 1vh;
            z-index: 10;
        }

        /* ===== INFO STYLE (Classic) ===== */
        .info-style {
            display: inline-block;
            position: relative;
            text-align: right;
            font-size: 1.509vh;
            font-weight: 600;
            padding: 0.3268vh 1.7068vh 0.2068vh 1.7068vh;
            color: #171717;
            margin-left: 0.1vh;
            background: white;
            transform: skewX(23deg);
            z-index: 1;
            line-height: 1.4;
        }
        .info-style::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            transform: skewX(23deg);
            z-index: -1;
        }
        .info-style-id {
            background: #FFCC3F !important;
            padding: 0.3268vh 0.9068vh 0.2068vh 1.7068vh !important;
        }
        .info-style-id::before {
            background: #FFCC3F !important;
        }
        .info-style span {
            display: inline-block;
            transform: skewX(-23deg);
        }

        /* ===== SERVER LOGO ===== */
        .server-logo {
            height: 4vh;
            width: auto;
            opacity: 0.9;
            pointer-events: none;
            z-index: 10;
            margin-right: 1vh;
        }

        /* ===== TIME BLOCK ===== */
        .time-block {
            display: flex;
            gap: 1vh;
            color: white;
            font-size: 1.8vh;
            font-weight: 600;
            background: rgba(0,0,0,0.3);
            padding: 0.3vh 1.2vh;
            border-radius: 0.6vh;
            backdrop-filter: blur(4px);
        }
        .time-icon {
            width: 2vh;
            height: 2vh;
        }

        /* ===== PLAYER INFO ===== */
        .player-info-block {
            display: flex;
            gap: 1vh;
            color: white;
            font-size: 1.8vh;
            font-weight: 600;
            background: rgba(0,0,0,0.3);
            padding: 0.3vh 1.2vh;
            border-radius: 0.6vh;
            backdrop-filter: blur(4px);
        }
        .player-nick { color: #FFCC3F; }
        .player-id { color: #ffffff; }

        /* ===== WEAPON BLOCK ===== */
        .weapon-block {
            position: absolute;
            top: 12vh;
            right: 4vh;
            display: flex;
            align-items: center;
            gap: 1vh;
            background: rgba(0,0,0,0.35);
            padding: 0.5vh 1.5vh 0.5vh 1vh;
            border-radius: 1vh;
            backdrop-filter: blur(4px);
        }
        .weapon-png {
            width: 5vh;
            height: auto;
            filter: drop-shadow(0 0 6px rgba(0,0,0,0.5));
        }
        .weapon-ammo {
            color: white;
            font-size: 1.8vh;
            font-weight: 600;
        }

        /* ===== PROGRESS BARS ===== */
        .progress-bar-block {
            position: absolute;
            top: 18vh;
            right: 4vh;
            display: flex;
            flex-direction: column;
            gap: 1vh;
        }
        .progress-bar-block > div {
            display: flex;
            align-items: center;
            gap: 0.8vh;
            background: rgba(0,0,0,0.3);
            padding: 0.3vh 1vh 0.3vh 0.5vh;
            border-radius: 0.6vh;
            backdrop-filter: blur(3px);
            min-width: 12vh;
        }
        .bar-icon {
            width: 2.5vh;
            height: auto;
            filter: drop-shadow(0 0 4px rgba(0,0,0,0.4));
        }
        .bar-indicator {
            color: white;
            font-size: 1.8vh;
            font-weight: 700;
            min-width: 5vh;
            text-align: right;
        }

        /* ===== MONEY BLOCK ===== */
        .money-block {
            position: absolute;
            bottom: 4vh;
            right: 4vh;
            background: rgba(0,0,0,0.35);
            padding: 0.8vh 2vh 0.8vh 1.5vh;
            border-radius: 0.8vh;
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            gap: 0.5vh;
        }
        .money {
            color: white;
            font-size: 2.2vh;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5vh;
        }

        /* ===== SPEEDOMETER ===== */
        .modern-cefstudio-speed {
            position: absolute;
            bottom: 4vh;
            left: 4vh;
            visibility: hidden;
        }
        .speed-bg {
            position: relative;
            width: 25vh;
            height: 25vh;
        }
        .speed-count {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 4vh;
            font-weight: 700;
            text-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        .speed-kmh {
            position: absolute;
            bottom: 3vh;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.5);
            font-size: 1.8vh;
            font-weight: 500;
        }
        .speed-meter {
            stroke: #FFCC3F;
            stroke-width: 8px;
            fill: none;
            transition: stroke-dashoffset 0.3s ease;
        }
        .speed-meter-bg {
            stroke: rgba(255,255,255,0.15);
            stroke-width: 8px;
            fill: none;
        }
        .arrow-icon {
            position: absolute;
            bottom: 1vh;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 1vh;
        }
        .arrow-icon svg {
            width: 2.5vh;
            height: 2vh;
        }
        .left-arrow-anim, .right-arrow-anim {
            fill: white;
            opacity: 0.3;
            transition: opacity 0.3s;
        }
        .left-arrow-anim.active, .right-arrow-anim.active {
            opacity: 1;
            animation: blink 0.6s infinite;
        }
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.2; }
            100% { opacity: 1; }
        }

        /* ===== FUEL ===== */
        .fuel-count {
            position: absolute;
            bottom: 1vh;
            right: 1vh;
            color: white;
            font-size: 1.6vh;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5vh;
        }
        .fuel-icon {
            width: 1.8vh;
            height: auto;
        }
        .odometr-block {
            position: absolute;
            bottom: 7vh;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.6);
            font-size: 1.4vh;
            font-weight: 500;
            text-align: center;
        }

        @media (max-width: 768px) {
            .money { min-width: 20vw; font-size: 1.6vh; }
            .weapon-block { right: 10vh; top: 12vh; }
            .weapon-png { width: 8vh; }
            .info-style { font-size: 1.2vh; padding: 0.2vh 1vh; }
            .server-logo { width: 18vh; top: 2.5vh; right: 4vh; }
        }
    </style>
</head>
<body>

<!-- ===== SPEEDOMETER ===== -->
<div class="modern-cefstudio-speed" id="modern-cefstudio-speed">
    <div class="speed-bg">
        <svg class="speed" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 167" stroke-linecap="round">
            <path class="speed-meter-bg" d="M41 149.5a77 77 0 1 1 117.93 0" fill="none" stroke-dasharray="4" />
            <path id="speed-meter" class="speed-meter" d="M41 149.5a77 77 0 1 1 117.93 0" fill="none" style="stroke-dasharray: 624.295, 504.295; stroke-dashoffset: 625;" />
        </svg>
        <div class="speed-content">
            <div id="speed-count" class="speed-count">0</div>
            <div class="speed-kmh">КМ/Ч</div>
        </div>
        <div class="arrow-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="17" height="10" viewBox="0 0 17 12" fill="none">
                <path id="left-arrow" class="left-arrow-anim" d="M6.09319 12V7.2H16.9634L17 4.788H6.09319V0L0 6L6.09319 12Z" fill="white" />
            </svg>
            <svg xmlns="http://www.w3.org/2000/svg" width="17" height="10" viewBox="0 0 17 12" fill="none">
                <path id="right-arrow" class="right-arrow-anim" d="M10.9068 -5.32684e-07L10.9068 4.8L0.0365607 4.8L4.1858e-07 7.212L10.9068 7.212L10.9068 12L17 6L10.9068 -5.32684e-07Z" fill="white" />
            </svg>
        </div>
        <div class="odometr-block">
            <div id="speed-odometer" class="speed-odometer">000000</div>
        </div>
        <div class="fuel-count">
            <svg class="fuel-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 17 20" fill="none">
                <path d="M0 0H3C3.28 0 3.53 0.115789 3.71 0.305263L5.79 2.50526L6.59 1.67368C7 1.26316 7.5 1.05263 8 1.05263H14C14.5 1.05263 15 1.26316 15.41 1.67368L16.41 2.72632C16.8 3.1579 17 3.68421 17 4.21053V17.8947C17 18.4531 16.7893 18.9886 16.4142 19.3834C16.0391 19.7782 15.5304 20 15 20H5C4.46957 20 3.96086 19.7782 3.58579 19.3834C3.21071 18.9886 3 18.4531 3 17.8947V11.5789V10.5263V6.31579C3 5.78947 3.2 5.26316 3.59 4.83158L4.38 3.98947L2.59 2.10526H0V0ZM8 3.15789V5.26316H14V3.15789H8ZM8.41 9.47368L6.41 7.36842H5V8.85263L7 10.9579V14.3053L5 16.4105V17.8947H6.41L8.41 15.7895H11.59L13.59 17.8947H15V16.4105L13 14.3053V10.9579L15 8.85263V7.36842H13.59L11.59 9.47368H8.41ZM9 11.5789H11V13.6842H9V11.5789Z" fill="white" fill-opacity="0.6" />
            </svg>
            <span id="speed-fuel">0 л</span>
        </div>
    </div>
</div>

<!-- ===== MAIN HUD ===== -->
<div id="modern-cefstudio" class="modern-cefstudio">
    <div class="top-logo-block">
        <img class="server-logo" src="icon/logotype.png" alt="logo">
        <div class="info-style"><span id="time">00:00</span></div>
        <div class="info-style"><span id="data">01.01.24</span></div>
        <div class="info-style"><span id="s1">Player</span></div>
        <div class="info-style info-style-id"><span id="s2">0</span></div>
    </div>

    <div class="weapon-block">
        <img id="weapon_id" class="weapon-png" src="icon/weapon/gun_0.png" alt="weapon">
        <div id="weapon_ammo" class="weapon-ammo"></div>
    </div>

    <div class="progress-bar-block">
        <div id="health-bar">
            <img class="bar-icon" src="icon/hp.svg" alt="hp">
            <div id="b1" class="bar-indicator">100</div>
        </div>
        <div id="armour-bar">
            <img class="bar-icon" src="icon/armour.svg" alt="armour">
            <div id="b3" class="bar-indicator">0</div>
        </div>
    </div>

    <div class="money-block">
        <div id="s3" class="money">
            <img src="icon/cash.svg" alt="cash" style="width:2.5vh; height:auto;">
            <span>0</span>
        </div>
    </div>
</div>

<style>
body { background: transparent; overflow: hidden; user-select: none; }
</style>

<!-- ============================================================ -->
<!-- JAVASCRIPT (ПОЛНОСТЬЮ ВАШ, БЕЗ ИЗМЕНЕНИЙ) -->
<!-- ============================================================ -->
<script>
document.ondragstart = test;
document.onselectstart = test;
document.oncontextmenu = test;
document.oncontextmenu;
function test() {
    return false;
}

cef.emit("game:hud:setComponentVisible", "interface", false);
cef.emit("game:data:pollPlayerStats", true, 50);

cef.on("game:data:playerStats", (hp, max_hp, arm, breath, wanted, weapon, ammo, max_ammo, money, speed) => {
    document.getElementById('b1').innerHTML = Math.round(hp);
    document.getElementById('b3').innerHTML = Math.round(arm);
    document.getElementById('s3').innerHTML = `<img src="icon/cash.svg" style="width: 23px; margin-top: -5px; margin-right: 8px;">${formatt(money)}`;

    var weaponID = weapon;
    var weaponAmmo = '';
    if (weaponID !== '0') {
        weaponAmmo = `${ammo}/${(max_ammo - ammo)}`;
    }

    speed_count = Math.round(speed * 1.4);
    document.getElementById("speed-count").innerHTML = `${speed_count}`;

    let meter_count = 838 + (speed * 3.77);
    document.getElementById("speed-meter").style = `stroke-dasharray: 838; stroke-dashoffset: -${meter_count};`;

    document.getElementById('weapon_id').src = `icon/weapon/gun_${weaponID}.png`;
    document.getElementById('weapon_ammo').innerHTML = weaponAmmo;
});

function formatt(i) {
    var text_fmt = `${i}`;
    var text_tmp = text_fmt;
    var text_len = text_fmt.length;
    var dots_count = 0;

    for (var idx = 0; idx < (text_len - 1); idx++) {
        if (text_tmp[idx] == '.') {
            continue;
        }
        if (((text_len - (idx + 1)) % 3) == 0) {
            dots_count++;
            text_tmp = text_tmp.slice(0, idx + dots_count) + '.' + text_tmp.slice(idx + dots_count);
        }
    }
    return text_tmp;
}

cef.on("modern:hud:visible", (type) => {
    if (type == 0) {
        document.getElementById('modern-cefstudio').style.visibility = 'hidden';
        is_open_hud = true;
    }
    if (type == 1) {
        document.getElementById('modern-cefstudio').style.visibility = 'visible';
        is_open_hud = false;
    }
});

cef.on("modern:hud:update", (b1, s1, s2) => {
    document.getElementById('b2').innerHTML = Math.round(b1);
    document.getElementById('s1').innerHTML = `${s1}`;
    document.getElementById('s2').innerHTML = `${s2}`;
});

cef.on("modern:speed:visible", () => {
    document.getElementById('modern-cefstudio-speed').style.visibility = 'visible';
});

cef.on("modern:speed:hidden", () => {
    document.getElementById('modern-cefstudio-speed').style.visibility = 'hidden';
});

// Таймер времени (добавлен для работы часов)
setInterval(function() {
    var d = new Date();
    document.getElementById('time').innerText = 
        String(d.getHours()).padStart(2,'0') + ':' +
        String(d.getMinutes()).padStart(2,'0');
    document.getElementById('data').innerText = 
        String(d.getDate()).padStart(2,'0') + '.' +
        String(d.getMonth()+1).padStart(2,'0') + '.' +
        String(d.getFullYear()).slice(2);
}, 1000);

</script>
</body>
</html>
