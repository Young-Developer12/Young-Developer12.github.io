<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>classic interface</title>
    <link href="https://fonts.googleapis.com/css?family=Montserrat:100,200,300,400,500,600,700" rel="stylesheet">
    <style>
        /* ===== RESET & BASE ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            overflow: hidden;
            user-select: none;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"><circle cx="100" cy="100" r="90" fill="%23222" opacity="0.2"/><circle cx="100" cy="100" r="60" fill="%23333" opacity="0.3"/></svg>') no-repeat center/cover;
            background-size: 200vh;
            background-position: right 0 top 0;
            font-family: 'Montserrat', sans-serif;
        }
        [v-cloak] { display: none !important; }

        /* ===== HUD CONTAINER ===== */
        .classic-hud {
            position: relative;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
        }

        /* ===== TOP RIGHT BLOCK ===== */
        .top-right-block {
            position: absolute;
            top: 0;
            right: 0;
            width: auto;
            height: auto;
        }

        /* ===== INFO CONTAINER (time/date/player/id) ===== */
        .info-container {
            position: absolute;
            right: 0;
            top: 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 0.1vh;
            width: max-content;
        }
        .info-style {
            display: inline-block;
            position: relative;
            text-align: right;
            font-size: 1.509vh;
            font-weight: 600;
            font-family: 'Montserrat', sans-serif;
            padding: 0.3268vh 1.7068vh 0.2068vh 1.7068vh;
            color: #171717;
            margin-left: 0.1vh;
            background: white;
            transform: skewX(23deg);
            z-index: 1;
            line-height: 1.4;
        }
        .info-style::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            transform: skewX(23deg);
            z-index: -1;
        }
        .info-style-id {
            background: #FFCC3F !important;
            padding: 0.3268vh 0.9068vh 0.2068vh 1.7068vh !important;
        }
        .info-style-id::before {
            background: #FFCC3F !important;
        }
        .info-style span {
            display: inline-block;
            transform: skewX(-23deg);
        }

        /* ===== LOGOTYPE ===== */
        .logotype {
            position: absolute;
            width: 25vh;
            top: 3.8vh;
            right: 8vh;
            opacity: 0.9;
            pointer-events: none;
        }

        /* ===== WEAPON CONTAINER ===== */
        .weapon-container {
            position: absolute;
            top: 15vh;
            right: 22vh;
            display: flex;
            align-items: center;
            gap: 0.5vh;
        }
        .weapon-icon {
            width: 10vh;
            height: auto;
            filter: drop-shadow(0 0 6px rgba(0,0,0,0.6));
        }
        .ammo-block {
            display: flex;
            align-items: baseline;
            gap: 0.2vh;
            background: rgba(0,0,0,0.35);
            padding: 0.3vh 1.2vh 0.3vh 0.8vh;
            border-radius: 0.6vh;
            backdrop-filter: blur(2px);
        }
        .ammo {
            color: white;
            font-size: 2.2vh;
            font-weight: 600;
            font-style: italic;
            letter-spacing: 0.1vh;
        }
        .max-ammo {
            color: rgba(255,255,255,0.55);
            font-size: 1.8vh;
            font-weight: 500;
            font-style: italic;
        }

        /* ===== RIGHT INDICATORS (armour/health/handcuffs) ===== */
        .right-indicator-container {
            position: absolute;
            top: 9vh;
            right: 0;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 1.2vh;
            width: 11vh;
        }
        .right-indicator-block {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            width: 100%;
            height: 3.5vh;
        }
        .progress-indicator {
            position: absolute;
            right: 7.6vh;
            top: -1.8vh;
            color: white;
            font-size: 1.9vh;
            font-weight: 700;
            text-align: right;
            text-shadow: 0 0 8px rgba(0,0,0,0.7);
        }
        .right-indicator-icon {
            width: 2.5vh;
            height: 2.5vh;
            margin-right: 1.8vh;
            filter: drop-shadow(0 0 4px rgba(0,0,0,0.5));
        }

        /* health circle */
        .circle-progress-bg {
            stroke: none;
            stroke-width: 6.592px;
        }
        .circle-progress {
            stroke: #EE2746;
            stroke-width: 6.592px;
            stroke-dasharray: 251;
            stroke-dashoffset: 251;
            transition: stroke-dashoffset 0.5s ease;
        }
        .circle-progress-icon {
            width: 2.67vh;
            position: absolute;
            right: 5.6vh;
            top: 0.2vh;
            pointer-events: none;
        }
        .circle-progress-indicator {
            position: absolute;
            right: 11.7vh;
            top: 0.5vh;
            color: white;
            font-size: 2.3vh;
            font-weight: 700;
            text-align: center;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }
        .right-indicator-block svg {
            width: 3.6vh;
            height: 3.6vh;
            margin-right: 1.2vh;
            flex-shrink: 0;
        }

        /* ===== CASH CONTAINER ===== */
        .cash-container {
            position: absolute;
            right: 3.9vh;
            top: 29vh;
            display: flex;
            flex-direction: column;
            gap: 0.5vh;
            align-items: flex-end;
        }
        .cash-block {
            display: flex;
            align-items: center;
            gap: 1vh;
            background: rgba(0,0,0,0.25);
            padding: 0.3vh 1.2vh 0.3vh 2vh;
            border-radius: 0.8vh;
            backdrop-filter: blur(2px);
        }
        .cash {
            color: white;
            font-size: 2vh;
            font-weight: 700;
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 0.05vh;
            min-width: 10vw;
            text-align: right;
        }
        .cash-block img {
            width: 3vh;
            height: auto;
            filter: drop-shadow(0 0 4px rgba(0,0,0,0.4));
        }

        /* ===== LOCATION ===== */
        .city-street-block {
            display: flex;
            position: absolute;
            bottom: 5.7vh;
            left: 31.5vh;
            align-items: center;
            gap: 0.5vh;
            background: rgba(0,0,0,0.2);
            padding: 0.5vh 2vh 0.5vh 1.2vh;
            border-radius: 0.8vh;
            backdrop-filter: blur(3px);
        }
        .city-street-block img {
            width: 3vh;
            height: auto;
            filter: drop-shadow(0 0 4px rgba(0,0,0,0.3));
        }
        .city-street-name {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
        }
        .city-name {
            font-size: 1.7vh;
            font-weight: 600;
            color: white;
            text-shadow: 0 0 8px rgba(0,0,0,0.6);
        }
        .street-name {
            font-size: 1.5vh;
            font-weight: 500;
            color: white;
            text-shadow: 0 0 6px rgba(0,0,0,0.5);
        }

        /* ===== RESPONSIVE TWEAKS ===== */
        @media (max-width: 768px) {
            .cash { min-width: 20vw; font-size: 1.6vh; }
            .weapon-container { right: 10vh; top: 12vh; }
            .weapon-icon { width: 8vh; }
            .info-style { font-size: 1.2vh; padding: 0.2vh 1vh; }
            .logotype { width: 18vh; top: 2.5vh; right: 4vh; }
            .city-street-block { left: 5vh; bottom: 3vh; }
        }
    </style>
</head>
<body>

<div class="classic-hud" v-if="active" v-cloak>
    <!-- TOP RIGHT -->
    <div class="top-right-block">

        <!-- INFO (time/date/player/id) -->
        <div class="info-container">
            <div class="info-style"><span>{{ time }}</span></div>
            <div class="info-style"><span>{{ date }}</span></div>
            <div class="info-style"><span>{{ player }}</span></div>
            <div class="info-style info-style-id"><span>{{ playerid }}</span></div>
        </div>

        <!-- LOGOTYPE -->
        <img class="logotype" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 60'><text x='0' y='40' font-family='Montserrat' font-size='32' font-weight='700' fill='%23fff' opacity='0.9'>CLASSIC</text><text x='0' y='58' font-family='Montserrat' font-size='14' font-weight='300' fill='%23ddd' opacity='0.7'>INTERFACE</text></svg>" alt="logo" />

        <!-- WEAPON -->
        <div class="weapon-container">
            <img v-if="!weapon.includes('gun_0.png')" class="weapon-icon" :src="weapon" alt="weapon">
            <div class="ammo-block" v-if="!weapon.includes('gun_0.png') && !weapon.includes('gun_1.png') && !weapon.includes('gun_2.png') && !weapon.includes('gun_3.png') && !weapon.includes('gun_4.png') && !weapon.includes('gun_5.png') && !weapon.includes('gun_6.png') && !weapon.includes('gun_7.png') && !weapon.includes('gun_8.png') && !weapon.includes('gun_10.png') && !weapon.includes('gun_14.png') && !weapon.includes('gun_15.png') && !weapon.includes('gun_46.png')">
                <span class="ammo">{{ ammo }}/</span>
                <span class="max-ammo">{{ maxammo }}</span>
            </div>
        </div>

        <!-- INDICATORS -->
        <div class="right-indicator-container">
            <!-- Armour -->
            <div class="right-indicator-block">
                <p v-if="armour !== 0" class="progress-indicator">{{ armour }}</p>
                <img class="right-indicator-icon" :src="armour !== 0 ? 'data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2235%22 fill=%22%23333%22 opacity=%220.5%22/><path d=%22M50 15 L70 25 L70 45 Q70 65 50 80 Q30 65 30 45 L30 25 Z%22 fill=%22%23ffcc3f%22 stroke=%22%23fff%22 stroke-width=%222%22/></svg>' : 'data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2235%22 fill=%22%23333%22 opacity=%220.4%22/><path d=%22M50 15 L70 25 L70 45 Q70 65 50 80 Q30 65 30 45 L30 25 Z%22 fill=%22%23666%22 stroke=%22%23999%22 stroke-width=%222%22/></svg>'" alt="armour">
            </div>

            <!-- Health -->
            <div class="right-indicator-block">
                <p class="circle-progress-indicator">{{ health }}</p>
                <svg viewBox="0 0 100 100" stroke-linecap="round" style="transform: rotate(-90deg);">
                    <circle class="circle-progress-bg" cx="50" cy="50" r="40" fill="rgba(0,0,0,0.4)" />
                    <circle id="circle-health" class="circle-progress" cx="50" cy="50" r="40" fill="none" />
                </svg>
                <img class="circle-progress-icon" src="data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><path d=%22M50 20 Q30 30 25 50 Q30 70 50 80 Q70 70 75 50 Q70 30 50 20 Z%22 fill=%22%23ee2746%22 stroke=%22%23fff%22 stroke-width=%223%22/></svg>" alt="hp">
            </div>

            <!-- Handcuffs -->
            <div class="right-indicator-block">
                <p v-if="handcuffs !== 0" class="progress-indicator">{{ handcuffs }}</p>
                <img class="right-indicator-icon" :src="handcuffs !== 0 ? 'data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2235%22 fill=%22%23333%22 opacity=%220.5%22/><circle cx=%2235%22 cy=%2240%22 r=%2212%22 fill=%22none%22 stroke=%22%23ffcc3f%22 stroke-width=%224%22/><circle cx=%2265%22 cy=%2240%22 r=%2212%22 fill=%22none%22 stroke=%22%23ffcc3f%22 stroke-width=%224%22/><line x1=%2235%22 y1=%2252%22 x2=%2265%22 y2=%2252%22 stroke=%22%23ffcc3f%22 stroke-width=%224%22/></svg>' : 'data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2235%22 fill=%22%23333%22 opacity=%220.4%22/><circle cx=%2235%22 cy=%2240%22 r=%2212%22 fill=%22none%22 stroke=%22%23666%22 stroke-width=%224%22/><circle cx=%2265%22 cy=%2240%22 r=%2212%22 fill=%22none%22 stroke=%22%23666%22 stroke-width=%224%22/><line x1=%2235%22 y1=%2252%22 x2=%2265%22 y2=%2252%22 stroke=%22%23666%22 stroke-width=%224%22/></svg>'" alt="handcuffs">
            </div>
        </div>

        <!-- CASH -->
        <div class="cash-container">
            <div class="cash-block">
                <div class="cash">{{ format(money) }}</div>
                <img src="data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect x=%2210%22 y=%2230%22 width=%2280%22 height=%2240%22 rx=%225%22 fill=%22%23f5c542%22 stroke=%22%23fff%22 stroke-width=%222%22/><text x=%2250%22 y=%2256%22 font-family='Montserrat' font-size=%2230%22 font-weight='bold' fill=%22%23fff%22 text-anchor='middle'>$</text></svg>" alt="wallet" style="bottom:0.3vh;">
            </div>
            <div class="cash-block">
                <div class="cash">{{ format(card) }}</div>
                <img src="data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect x=%2210%22 y=%2230%22 width=%2280%22 height=%2240%22 rx=%225%22 fill=%22%234a7db4%22 stroke=%22%23fff%22 stroke-width=%222%22/><rect x=%2220%22 y=%2245%22 width=%2240%22 height=%228%22 rx=%222%22 fill=%22%23fff%22 opacity=%220.7%22/><text x=%2265%22 y=%2254%22 font-family='Montserrat' font-size=%2216%22 font-weight='bold' fill=%22%23fff%22>****</text></svg>" alt="card" style="bottom:0.1vh;">
            </div>
        </div>
    </div>

    <!-- LOCATION -->
    <div class="city-street-block">
        <img src="data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2240%22 fill=%22none%22 stroke=%22%23fff%22 stroke-width=%224%22/><circle cx=%2250%22 cy=%2250%22 r=%2212%22 fill=%22%23ffcc3f%22 stroke=%22%23fff%22 stroke-width=%223%22/></svg>" alt="loc">
        <div class="city-street-name">
            <div class="city-name">{{ city }}</div>
            <div class="street-name">{{ street }}</div>
        </div>
    </div>
</div>

<!-- ===== VUE ===== -->
<script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.min.js"></script>
<script>
    // ============================================================
    //  CEF STUB (имитация окружения для работы вне игры)
    // ============================================================
    if (typeof cef === 'undefined') {
        window.cef = {
            emit: function() { console.log('[CEF] emit', arguments); },
            on: function(event, cb) {
                console.log('[CEF] on', event);
                // Для теста — вызываем колбэки с фейковыми данными через 1с
                if (event === 'game:hud:setComponentVisible') { /* noop */ }
                if (event === 'classic:hud:active') {
                    setTimeout(() => cb(true), 300);
                }
                if (event === 'classic:hud:location') {
                    setTimeout(() => cb('г.Арзамас', 'ул.Пушкина 52'), 400);
                }
                if (event === 'classic:hud:update') {
                    setTimeout(() => cb(1500, 4200, 'Mironchik_Dev', 7), 500);
                }
                if (event === 'game:hud:update') {
                    setTimeout(() => cb(75, 42, 'gun_23.png', 30, 12, 0, 1000, 0), 600);
                }
            }
        };
        // Доп. эмуляция для setHealth и т.п.
        window.cef.emit('game:hud:setComponentVisible', 'interface', false);
        window.cef.emit('game:hud:setComponentVisible', 'radar', true);
    }

    // ============================================================
    //  VUE APP
    // ============================================================
    var CEFSTUDIO = new Vue({
        el: '.classic-hud',
        data: {
            active: false,
            date: '05.05.24',
            time: '20:33:43',
            player: 'Mironchik_Dev',
            playerid: 0,
            weapon: 'images/gun/gun_0.png',
            ammo: 0,
            maxammo: 0,
            armour: 0,
            health: 0,
            handcuffs: 0,
            money: 0,
            card: 0,
            city: 'г.Арзамас',
            street: 'ул.Пушкина 52'
        },
        mounted() {
            // Клавиша F7 — toggle HUD
            window.addEventListener('keydown', (event) => {
                if (event.key === 'F7') {
                    if (this.active) {
                        this.active = false;
                        if (typeof cef !== 'undefined') cef.emit('game:hud:setComponentVisible', 'radar', false);
                    } else {
                        this.active = true;
                        if (typeof cef !== 'undefined') cef.emit('game:hud:setComponentVisible', 'radar', true);
                    }
                }
            });

            // Эмуляция начальных данных
            setTimeout(() => {
                this.active = true;
                this.updateHealth(75);
                this.armour = 42;
                this.handcuffs = 0;
                this.weapon = 'data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 200 80%22><rect x=%2220%22 y=%2220%22 width=%22160%22 height=%2230%22 rx=%225%22 fill=%22%23555%22 stroke=%22%23999%22 stroke-width=%222%22/><rect x=%2230%22 y=%2230%22 width=%22100%22 height=%2210%22 fill=%22%23777%22/><circle cx=%22180%22 cy=%2235%22 r=%2210%22 fill=%22%23aa3333%22/></svg>';
                this.ammo = 30;
                this.maxammo = 100;
                this.money = 1500;
                this.card = 4200;
                this.city = 'г.Арзамас';
                this.street = 'ул.Пушкина 52';
            }, 200);

            // Подписка на CEF-события (если есть)
            if (typeof cef !== 'undefined') {
                cef.on('classic:hud:active', (t) => { this.active = t; });
                cef.on('classic:hud:location', (city, street) => {
                    if (this.active) { this.city = city; this.street = street; }
                });
                cef.on('classic:hud:update', (money, card, player, playerid) => {
                    if (this.active) {
                        this.money = money;
                        this.card = card;
                        this.player = player;
                        this.playerid = playerid;
                    }
                });
                // Основное обновление (health, armour, weapon, ammo...)
                cef.on('game:hud:update', (health, armour, weapon, ammo, maxammo, handcuffs, money, card) => {
                    if (this.active) {
                        this.updateHealth(health);
                        this.armour = armour;
                        this.weapon = weapon;
                        this.ammo = ammo;
                        this.maxammo = maxammo;
                        this.handcuffs = handcuffs;
                        this.money = money;
                        this.card = card;
                    }
                });
            }

            // Таймер времени/даты
            setInterval(() => {
                if (this.active) {
                    const d = new Date();
                    this.time = String(d.getHours()).padStart(2,'0') + ':' +
                               String(d.getMinutes()).padStart(2,'0') + ':' +
                               String(d.getSeconds()).padStart(2,'0');
                    const day = String(d.getDate()).padStart(2,'0');
                    const mon = String(d.getMonth()+1).padStart(2,'0');
                    this.date = day + '.' + mon + '.' + String(d.getFullYear()).slice(2);
                }
            }, 1000);
        },
        methods: {
            visible(status) { this.active = status; },
            format(val) {
                if (val === undefined || val === null) return '0';
                let s = String(val).replace(/,/g,'');
                let len = s.length;
                let dots = 0;
                for (let i = 0; i < len; i++) {
                    if ((len - i) % 3 === 0 && i > 0) {
                        s = s.slice(0, i + dots) + ',' + s.slice(i + dots);
                        dots++;
                    }
                }
                return s;
            },
            updateHealth(val) {
                this.health = Math.round(val);
                const circle = document.getElementById('circle-health');
                if (circle) {
                    const circumference = 251;
                    const progress = Math.min(100, Math.max(0, val));
                    const offset = circumference - (progress / 100) * circumference;
                    circle.style.strokeDashoffset = offset;
                }
            }
        }
    });

    // Глобальный доступ для CEF
    window.CEFSTUDIO = CEFSTUDIO;
    // Для совместимости со старым кодом
    window.setHealth = function(val) {
        if (CEFSTUDIO) CEFSTUDIO.updateHealth(val);
    };

    console.log('[HUD] Ready');
</script>
</body>
</html>
