<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Classic Interface</title>
    <link rel="stylesheet" href="css/fonts/stylesheet.css">
    <link href="https://fonts.googleapis.com/css?family=Montserrat:100,200,300,400,500,600,700" rel="stylesheet">
    <style>
        /* ===== RESET & BASE ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            user-select: none;
            background: transparent !important;
            font-family: 'Montserrat', sans-serif;
        }

        /* ===== HUD CONTAINER ===== */
        .classic-hud {
            position: relative;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            display: none; /* Скрыт по умолчанию */
        }
        .classic-hud.active {
            display: block;
        }

        /* ===== TOP RIGHT BLOCK ===== */
        .top-right-block {
            position: absolute;
            top: 0;
            right: 0;
            width: auto;
            height: auto;
        }

        /* ===== INFO CONTAINER ===== */
        .info-container {
            position: absolute;
            right: 0;
            top: 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 0.1vh;
            width: max-content;
            z-index: 10;
        }
        .info-style {
            display: inline-block;
            position: relative;
            text-align: right;
            font-size: 1.509vh;
            font-weight: 600;
            font-family: 'Montserrat', sans-serif;
            padding: 0.3268vh 1.7068vh 0.2068vh 1.7068vh;
            color: #171717;
            margin-left: 0.1vh;
            background: white;
            transform: skewX(23deg);
            z-index: 1;
            line-height: 1.4;
        }
        .info-style::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            transform: skewX(23deg);
            z-index: -1;
        }
        .info-style-id {
            background: #FFCC3F !important;
            padding: 0.3268vh 0.9068vh 0.2068vh 1.7068vh !important;
        }
        .info-style-id::before {
            background: #FFCC3F !important;
        }
        .info-style span {
            display: inline-block;
            transform: skewX(-23deg);
        }

        /* ===== LOGOTYPE ===== */
        .logotype {
            position: absolute;
            width: 25vh;
            top: 3.8vh;
            right: 8vh;
            opacity: 0.9;
            pointer-events: none;
            z-index: 10;
        }

        /* ===== WEAPON ===== */
        .weapon-container {
            position: absolute;
            top: 15vh;
            right: 22vh;
            display: flex;
            align-items: center;
            gap: 0.5vh;
            z-index: 10;
        }
        .weapon-icon {
            width: 10vh;
            height: auto;
            filter: drop-shadow(0 0 6px rgba(0,0,0,0.6));
            display: none;
        }
        .ammo-block {
            display: none;
            align-items: baseline;
            gap: 0.2vh;
            background: rgba(0,0,0,0.35);
            padding: 0.3vh 1.2vh 0.3vh 0.8vh;
            border-radius: 0.6vh;
            backdrop-filter: blur(2px);
        }
        .ammo {
            color: white;
            font-size: 2.2vh;
            font-weight: 600;
            font-style: italic;
            letter-spacing: 0.1vh;
        }
        .max-ammo {
            color: rgba(255,255,255,0.55);
            font-size: 1.8vh;
            font-weight: 500;
            font-style: italic;
        }

        /* ===== INDICATORS ===== */
        .right-indicator-container {
            position: absolute;
            top: 9vh;
            right: 0;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 1.2vh;
            width: 11vh;
            z-index: 10;
        }
        .right-indicator-block {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            width: 100%;
            height: 3.5vh;
        }
        .progress-indicator {
            position: absolute;
            right: 7.6vh;
            top: -1.8vh;
            color: white;
            font-size: 1.9vh;
            font-weight: 700;
            text-align: right;
            text-shadow: 0 0 8px rgba(0,0,0,0.7);
        }
        .right-indicator-icon {
            width: 2.5vh;
            height: 2.5vh;
            margin-right: 1.8vh;
            filter: drop-shadow(0 0 4px rgba(0,0,0,0.5));
        }
        .circle-progress-bg {
            stroke: none;
        }
        .circle-progress {
            stroke: #EE2746;
            stroke-width: 6.592px;
            stroke-dasharray: 251;
            stroke-dashoffset: 251;
            transition: stroke-dashoffset 0.5s ease;
        }
        .circle-progress-icon {
            width: 2.67vh;
            position: absolute;
            right: 5.6vh;
            top: 0.2vh;
            pointer-events: none;
        }
        .circle-progress-indicator {
            position: absolute;
            right: 11.7vh;
            top: 0.5vh;
            color: white;
            font-size: 2.3vh;
            font-weight: 700;
            text-align: center;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }
        .right-indicator-block svg {
            width: 3.6vh;
            height: 3.6vh;
            margin-right: 1.2vh;
            flex-shrink: 0;
        }

        /* ===== CASH ===== */
        .cash-container {
            position: absolute;
            right: 3.9vh;
            top: 29vh;
            display: flex;
            flex-direction: column;
            gap: 0.5vh;
            align-items: flex-end;
            z-index: 10;
        }
        .cash-block {
            display: flex;
            align-items: center;
            gap: 1vh;
            background: rgba(0,0,0,0.25);
            padding: 0.3vh 1.2vh 0.3vh 2vh;
            border-radius: 0.8vh;
            backdrop-filter: blur(2px);
        }
        .cash {
            color: white;
            font-size: 2vh;
            font-weight: 700;
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 0.05vh;
            min-width: 10vw;
            text-align: right;
        }
        .cash-block img {
            width: 3vh;
            height: auto;
            filter: drop-shadow(0 0 4px rgba(0,0,0,0.4));
        }

        /* ===== LOCATION ===== */
        .city-street-block {
            display: flex;
            position: absolute;
            bottom: 5.7vh;
            left: 31.5vh;
            align-items: center;
            gap: 0.5vh;
            background: rgba(0,0,0,0.2);
            padding: 0.5vh 2vh 0.5vh 1.2vh;
            border-radius: 0.8vh;
            backdrop-filter: blur(3px);
            z-index: 10;
        }
        .city-street-block img {
            width: 3vh;
            height: auto;
            filter: drop-shadow(0 0 4px rgba(0,0,0,0.3));
        }
        .city-street-name {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
        }
        .city-name {
            font-size: 1.7vh;
            font-weight: 600;
            color: white;
            text-shadow: 0 0 8px rgba(0,0,0,0.6);
        }
        .street-name {
            font-size: 1.5vh;
            font-weight: 500;
            color: white;
            text-shadow: 0 0 6px rgba(0,0,0,0.5);
        }

        @media (max-width: 768px) {
            .cash { min-width: 20vw; font-size: 1.6vh; }
            .weapon-container { right: 10vh; top: 12vh; }
            .weapon-icon { width: 8vh; }
            .info-style { font-size: 1.2vh; padding: 0.2vh 1vh; }
            .logotype { width: 18vh; top: 2.5vh; right: 4vh; }
            .city-street-block { left: 5vh; bottom: 3vh; }
        }
    </style>
</head>
<body>

<div id="hud" class="classic-hud">
    <!-- TOP RIGHT -->
    <div class="top-right-block">

        <!-- INFO -->
        <div class="info-container">
            <div class="info-style"><span id="time">00:00:00</span></div>
            <div class="info-style"><span id="date">01.01.24</span></div>
            <div class="info-style"><span id="player">Player</span></div>
            <div class="info-style info-style-id"><span id="playerid">0</span></div>
        </div>

        <!-- LOGOTYPE -->
        <img class="logotype" src="css/fonts/fonts.png" alt="logo" />

        <!-- WEAPON -->
        <div class="weapon-container">
            <img id="weapon-icon" class="weapon-icon" src="images/gun/gun_0.png" alt="weapon">
            <div id="ammo-block" class="ammo-block">
                <span id="ammo" class="ammo">0</span>
                <span id="maxammo" class="max-ammo">0</span>
            </div>
        </div>

        <!-- INDICATORS -->
        <div class="right-indicator-container">
            <!-- Armour -->
            <div class="right-indicator-block">
                <p id="armour-text" class="progress-indicator"></p>
                <img id="armour-icon" class="right-indicator-icon" src="images/arm_noactive.svg" alt="armour">
            </div>

            <!-- Health -->
            <div class="right-indicator-block">
                <p id="health-text" class="circle-progress-indicator">100</p>
                <svg viewBox="0 0 100 100" stroke-linecap="round" style="transform: rotate(-90deg);">
                    <circle class="circle-progress-bg" cx="50" cy="50" r="40" fill="rgba(0,0,0,0.4)" />
                    <circle id="circle-health" class="circle-progress" cx="50" cy="50" r="40" fill="none" />
                </svg>
                <img class="circle-progress-icon" src="images/hp.svg" alt="hp">
            </div>

            <!-- Handcuffs -->
            <div class="right-indicator-block">
                <p id="handcuffs-text" class="progress-indicator"></p>
                <img id="handcuffs-icon" class="right-indicator-icon" src="images/handcuffs_noactive.svg" alt="handcuffs">
            </div>
        </div>

        <!-- CASH -->
        <div class="cash-container">
            <div class="cash-block">
                <div id="money" class="cash">0</div>
                <img src="images/wallet.svg" alt="wallet" style="bottom:0.3vh;">
            </div>
            <div class="cash-block">
                <div id="card" class="cash">0</div>
                <img src="images/card.svg" alt="card" style="bottom:0.1vh;">
            </div>
        </div>
    </div>

    <!-- LOCATION -->
    <div class="city-street-block">
        <img src="images/location.svg" alt="loc">
        <div class="city-street-name">
            <div id="city" class="city-name">г.Арзамас</div>
            <div id="street" class="street-name">ул.Пушкина 52</div>
        </div>
    </div>
</div>

<!-- ============================================================ -->
<!-- СКРИПТ: ЧИСТЫЙ JS, БЕЗ VUE -->
<!-- ============================================================ -->
<script>
    // ============================================================
    // 1. ПОВОРОТНИКИ (Q / E) — оставляем как в вашем примере
    // ============================================================
    var left_arrow = false;
    var right_arrow = false;

    document.addEventListener('keyup', function (event) {
        if (event.keyCode === 81) { // Q
            if (left_arrow == false) {
                document.getElementById("left-arrow").style = "animation: arrow 0.6s infinite;";
                document.getElementById("right-arrow").style = "animation: 0; animation-delay: 0;";
                left_arrow = true;
                right_arrow = false;
            } else {
                document.getElementById("left-arrow").style = "animation: 0; animation-delay: 0;";
                document.getElementById("right-arrow").style = "animation: 0; animation-delay: 0;";
                left_arrow = false;
                right_arrow = false;
            }
        }
    });

    document.addEventListener('keyup', function (event) {
        if (event.keyCode === 69) { // E
            if (right_arrow == false) {
                document.getElementById("right-arrow").style = "animation: arrow 0.6s infinite;";
                document.getElementById("left-arrow").style = "animation: 0; animation-delay: 0;";
                right_arrow = true;
                left_arrow = false;
            } else {
                document.getElementById("right-arrow").style = "animation: 0; animation-delay: 0;";
                document.getElementById("left-arrow").style = "animation: 0; animation-delay: 0;";
                right_arrow = false;
                left_arrow = false;
            }
        }
    });

    // ============================================================
    // 2. ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
    // ============================================================
    function formatNumber(val) {
        if (val === undefined || val === null) return '0';
        var s = String(val).replace(/,/g,'');
        var len = s.length;
        var dots = 0;
        for (var i = 0; i < len; i++) {
            if ((len - i) % 3 === 0 && i > 0) {
                s = s.slice(0, i + dots) + ',' + s.slice(i + dots);
                dots++;
            }
        }
        return s;
    }

    function updateHealthCircle(val) {
        var circle = document.getElementById('circle-health');
        if (circle) {
            var circumference = 251;
            var progress = Math.max(0, Math.min(100, val));
            var offset = circumference - (progress / 100) * circumference;
            circle.style.strokeDashoffset = offset;
        }
    }

    // ============================================================
    // 3. ТАЙМЕР ВРЕМЕНИ (реальное время)
    // ============================================================
    setInterval(function() {
        var d = new Date();
        document.getElementById('time').innerText = 
            String(d.getHours()).padStart(2,'0') + ':' +
            String(d.getMinutes()).padStart(2,'0') + ':' +
            String(d.getSeconds()).padStart(2,'0');
        document.getElementById('date').innerText = 
            String(d.getDate()).padStart(2,'0') + '.' +
            String(d.getMonth()+1).padStart(2,'0') + '.' +
            String(d.getFullYear()).slice(2);
    }, 1000);

    // ============================================================
    // 4. ПОДКЛЮЧЕНИЕ CEF СОБЫТИЙ (как в вашем примере)
    // ============================================================
    if (typeof cef !== 'undefined') {
        // Показать/скрыть HUD
        cef.on('classic:hud:active', function(active) {
            document.getElementById('hud').className = active ? 'classic-hud active' : 'classic-hud';
        });

        // Локация
        cef.on('classic:hud:location', function(city, street) {
            document.getElementById('city').innerText = city || 'г.Арзамас';
            document.getElementById('street').innerText = street || 'ул.Пушкина 52';
        });

        // Обновление денег и инфо
        cef.on('classic:hud:update', function(money, card, player, playerid) {
            document.getElementById('money').innerText = formatNumber(money);
            document.getElementById('card').innerText = formatNumber(card);
            document.getElementById('player').innerText = player || 'Player';
            document.getElementById('playerid').innerText = playerid || 0;
        });

        // Основное обновление (здоровье, броня, оружие)
        cef.on('game:hud:update', function(health, armour, weapon, ammo, maxammo, handcuffs, money, card) {
            // Здоровье
            document.getElementById('health-text').innerText = Math.round(health);
            updateHealthCircle(health);

            // Броня
            if (armour > 0) {
                document.getElementById('armour-text').innerText = Math.round(armour);
                document.getElementById('armour-icon').src = 'images/arm_active.svg';
            } else {
                document.getElementById('armour-text').innerText = '';
                document.getElementById('armour-icon').src = 'images/arm_noactive.svg';
            }

            // Оружие
            var weaponIcon = document.getElementById('weapon-icon');
            var ammoBlock = document.getElementById('ammo-block');
            if (weapon && !weapon.includes('gun_0.png') && !weapon.includes('gun_1.png')) {
                weaponIcon.src = weapon;
                weaponIcon.style.display = 'block';
                ammoBlock.style.display = 'flex';
                document.getElementById('ammo').innerText = ammo || 0;
                document.getElementById('maxammo').innerText = maxammo || 0;
            } else {
                weaponIcon.style.display = 'none';
                ammoBlock.style.display = 'none';
            }

            // Наручники
            if (handcuffs > 0) {
                document.getElementById('handcuffs-text').innerText = handcuffs;
                document.getElementById('handcuffs-icon').src = 'images/handcuffs_active.svg';
            } else {
                document.getElementById('handcuffs-text').innerText = '';
                document.getElementById('handcuffs-icon').src = 'images/handcuffs_noactive.svg';
            }

            // Деньги (если не пришли отдельно)
            if (money !== undefined) {
                document.getElementById('money').innerText = formatNumber(money);
            }
            if (card !== undefined) {
                document.getElementById('card').innerText = formatNumber(card);
            }
        });

        // Отдельные обновления (если нужны)
        cef.on('hud:update:money', function(money) {
            document.getElementById('money').innerText = formatNumber(money);
        });
        cef.on('hud:update:bank', function(card) {
            document.getElementById('card').innerText = formatNumber(card);
        });
        cef.on('hud:update:playerinfo', function(player, playerid) {
            document.getElementById('player').innerText = player || 'Player';
            document.getElementById('playerid').innerText = playerid || 0;
        });
        cef.on('hud:update:health', function(health) {
            document.getElementById('health-text').innerText = Math.round(health);
            updateHealthCircle(health);
        });
        cef.on('hud:update:armor', function(armor) {
            if (armor > 0) {
                document.getElementById('armour-text').innerText = Math.round(armor);
                document.getElementById('armour-icon').src = 'images/arm_active.svg';
            } else {
                document.getElementById('armour-text').innerText = '';
                document.getElementById('armour-icon').src = 'images/arm_noactive.svg';
            }
        });
        cef.on('hud:update:weapon', function(weapon, ammo, maxammo) {
            var weaponIcon = document.getElementById('weapon-icon');
            var ammoBlock = document.getElementById('ammo-block');
            if (weapon && !weapon.includes('gun_0.png') && !weapon.includes('gun_1.png')) {
                weaponIcon.src = weapon;
                weaponIcon.style.display = 'block';
                ammoBlock.style.display = 'flex';
                document.getElementById('ammo').innerText = ammo || 0;
                document.getElementById('maxammo').innerText = maxammo || 0;
            } else {
                weaponIcon.style.display = 'none';
                ammoBlock.style.display = 'none';
            }
        });
    }

    // F7 — переключение HUD
    document.addEventListener('keydown', function(event) {
        if (event.key === 'F7') {
            var hud = document.getElementById('hud');
            hud.className = hud.className.includes('active') ? 'classic-hud' : 'classic-hud active';
            if (typeof cef !== 'undefined') {
                cef.emit('game:hud:setComponentVisible', 'radar', hud.className.includes('active'));
            }
        }
    });

    console.log('[HUD] Ready, press F7 to toggle');
</script>
</body>
</html>
