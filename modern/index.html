<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>MODERN HUD</title>
    <meta http-equiv='X-UA-Compatible' content='ie=edge'>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            user-select: none;
            background: transparent !important;
            font-family: 'Montserrat', sans-serif;
        }

        /* ===== HUD CONTAINER ===== */
        .modern-cefstudio {
            position: relative;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            visibility: visible;
        }

        /* ===== TOP RIGHT BLOCK ===== */
        .top-logo-block {
            position: absolute;
            top: 2vh;
            right: 2vh;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: flex-end;
            gap: 0.8vh;
            max-width: 50vw;
            z-index: 10;
        }

        /* ===== INFO STYLE (Classic Premium) ===== */
        .info-style {
            display: inline-block;
            position: relative;
            text-align: right;
            font-size: 1.4vh;
            font-weight: 700;
            padding: 0.4vh 1.8vh 0.4vh 1.8vh;
            color: #1a1a1a;
            background: rgba(255, 255, 255, 0.92);
            transform: skewX(-15deg);
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            letter-spacing: 0.05vh;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .info-style span {
            display: inline-block;
            transform: skewX(15deg);
        }
        .info-style-id {
            background: #FFCC3F !important;
            color: #000 !important;
            font-weight: 800;
        }

        /* ===== SERVER LOGO ===== */
        .server-logo {
            height: 4.5vh;
            width: auto;
            opacity: 0.95;
            pointer-events: none;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3));
            margin-right: 1vh;
        }

        /* ===== WEAPON BLOCK ===== */
        .weapon-block {
            position: absolute;
            top: 11vh;
            right: 3.5vh;
            display: flex;
            align-items: center;
            gap: 0.6vh;
            background: rgba(0, 0, 0, 0.55);
            padding: 0.5vh 1.2vh 0.5vh 0.8vh;
            border-radius: 1.2vh;
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .weapon-png {
            width: 5.5vh;
            height: auto;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.1));
        }
        .weapon-ammo {
            color: #fff;
            font-size: 1.6vh;
            font-weight: 600;
            background: rgba(0, 0, 0, 0.3);
            padding: 0.2vh 0.8vh;
            border-radius: 0.4vh;
            border-left: 2px solid rgba(255,255,255,0.15);
        }

        /* ===== PROGRESS BARS (Modern) ===== */
        .progress-bar-block {
            position: absolute;
            top: 17vh;
            right: 3.5vh;
            display: flex;
            flex-direction: column;
            gap: 0.8vh;
        }
        .progress-bar-block > div {
            display: flex;
            align-items: center;
            gap: 0.6vh;
            background: rgba(0, 0, 0, 0.45);
            padding: 0.3vh 0.8vh 0.3vh 0.5vh;
            border-radius: 0.8vh;
            backdrop-filter: blur(6px);
            min-width: 14vh;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.06);
        }
        .bar-icon {
            width: 2.8vh;
            height: auto;
            filter: drop-shadow(0 0 6px rgba(0,0,0,0.5));
        }
        .bar-indicator {
            color: #fff;
            font-size: 1.8vh;
            font-weight: 700;
            min-width: 5vh;
            text-align: right;
            text-shadow: 0 0 10px rgba(0,0,0,0.6);
        }
        /* Цветные полоски под барами (визуальные) */
        .bar-fill {
            height: 0.3vh;
            border-radius: 0.3vh;
            width: 100%;
            margin-top: 0.2vh;
            background: linear-gradient(90deg, #00ff88, #00cc66);
            box-shadow: 0 0 8px rgba(0,255,136,0.3);
        }
        .bar-fill.armour {
            background: linear-gradient(90deg, #4d9eff, #0066ff);
            box-shadow: 0 0 8px rgba(77,158,255,0.3);
        }

        /* ===== MONEY BLOCK ===== */
        .money-block {
            position: absolute;
            bottom: 4vh;
            right: 3.5vh;
            background: rgba(0, 0, 0, 0.5);
            padding: 0.8vh 2vh 0.8vh 1.5vh;
            border-radius: 1.2vh;
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255,255,255,0.08);
            display: flex;
            align-items: center;
            gap: 0.8vh;
        }
        .money {
            color: #fff;
            font-size: 2.2vh;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.6vh;
            text-shadow: 0 0 15px rgba(0,0,0,0.4);
        }
        .money img {
            filter: drop-shadow(0 0 8px rgba(255,215,0,0.3));
        }

        /* ===== SPEEDOMETER (Premium) ===== */
        .modern-cefstudio-speed {
            position: absolute;
            bottom: 4vh;
            left: 3.5vh;
            visibility: hidden;
            transition: opacity 0.4s ease;
        }
        .speed-bg {
            position: relative;
            width: 26vh;
            height: 26vh;
        }
        .speed-count {
            position: absolute;
            top: 44%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 5.2vh;
            font-weight: 800;
            text-shadow: 0 0 30px rgba(0,0,0,0.8);
            letter-spacing: 0.1vh;
        }
        .speed-kmh {
            position: absolute;
            bottom: 3.5vh;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.5);
            font-size: 1.6vh;
            font-weight: 500;
            letter-spacing: 0.2vh;
            text-transform: uppercase;
        }
        .speed-meter {
            stroke: #FFCC3F;
            stroke-width: 6px;
            fill: none;
            transition: stroke-dashoffset 0.3s ease;
            filter: drop-shadow(0 0 12px rgba(255,204,63,0.3));
        }
        .speed-meter-bg {
            stroke: rgba(255,255,255,0.1);
            stroke-width: 6px;
            fill: none;
        }
        /* Стрелки поворотников */
        .arrow-icon {
            position: absolute;
            bottom: 1.2vh;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 1.2vh;
        }
        .arrow-icon svg {
            width: 2.8vh;
            height: 2vh;
        }
        .left-arrow-anim, .right-arrow-anim {
            fill: rgba(255,255,255,0.2);
            transition: all 0.3s;
            filter: drop-shadow(0 0 4px rgba(255,255,255,0));
        }
        .left-arrow-anim.active, .right-arrow-anim.active {
            fill: #FFCC3F;
            animation: blink 0.6s infinite;
            filter: drop-shadow(0 0 12px rgba(255,204,63,0.6));
        }
        @keyframes blink {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* ===== FUEL ===== */
        .fuel-count {
            position: absolute;
            bottom: 0.8vh;
            right: 1.5vh;
            color: rgba(255,255,255,0.7);
            font-size: 1.4vh;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5vh;
            background: rgba(0,0,0,0.2);
            padding: 0.2vh 0.8vh;
            border-radius: 0.6vh;
            backdrop-filter: blur(2px);
        }
        .fuel-icon {
            width: 1.8vh;
            height: auto;
            opacity: 0.7;
        }
        .odometr-block {
            position: absolute;
            bottom: 6.5vh;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.4);
            font-size: 1.2vh;
            font-weight: 500;
            text-align: center;
            letter-spacing: 0.1vh;
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 768px) {
            .money-block { bottom: 2vh; right: 2vh; padding: 0.5vh 1.2vh; }
            .weapon-block { top: 14vh; right: 2vh; }
            .progress-bar-block { top: 20vh; right: 2vh; }
            .modern-cefstudio-speed { bottom: 2vh; left: 2vh; }
            .speed-bg { width: 20vh; height: 20vh; }
            .speed-count { font-size: 4vh; }
            .info-style { font-size: 1.2vh; padding: 0.2vh 1vh; }
            .top-logo-block { top: 1vh; right: 1vh; gap: 0.4vh; }
            .server-logo { height: 3vh; }
        }
    </style>
</head>
<body>

<!-- ===== SPEEDOMETER ===== -->
<div class="modern-cefstudio-speed" id="modern-cefstudio-speed">
    <div class="speed-bg">
        <svg class="speed" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 167" stroke-linecap="round">
            <path class="speed-meter-bg" d="M41 149.5a77 77 0 1 1 117.93 0" fill="none" stroke-dasharray="4" />
            <path id="speed-meter" class="speed-meter" d="M41 149.5a77 77 0 1 1 117.93 0" fill="none" style="stroke-dasharray: 624.295, 504.295; stroke-dashoffset: 625;" />
        </svg>
        <div class="speed-content">
            <div id="speed-count" class="speed-count">0</div>
            <div class="speed-kmh">КМ/Ч</div>
        </div>
        <div class="arrow-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="17" height="10" viewBox="0 0 17 12" fill="none">
                <path id="left-arrow" class="left-arrow-anim" d="M6.09319 12V7.2H16.9634L17 4.788H6.09319V0L0 6L6.09319 12Z" fill="white" />
            </svg>
            <svg xmlns="http://www.w3.org/2000/svg" width="17" height="10" viewBox="0 0 17 12" fill="none">
                <path id="right-arrow" class="right-arrow-anim" d="M10.9068 -5.32684e-07L10.9068 4.8L0.0365607 4.8L4.1858e-07 7.212L10.9068 7.212L10.9068 12L17 6L10.9068 -5.32684e-07Z" fill="white" />
            </svg>
        </div>
        <div class="odometr-block">
            <div id="speed-odometer" class="speed-odometer">000000</div>
        </div>
        <div class="fuel-count">
            <svg class="fuel-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 17 20" fill="none">
                <path d="M0 0H3C3.28 0 3.53 0.115789 3.71 0.305263L5.79 2.50526L6.59 1.67368C7 1.26316 7.5 1.05263 8 1.05263H14C14.5 1.05263 15 1.26316 15.41 1.67368L16.41 2.72632C16.8 3.1579 17 3.68421 17 4.21053V17.8947C17 18.4531 16.7893 18.9886 16.4142 19.3834C16.0391 19.7782 15.5304 20 15 20H5C4.46957 20 3.96086 19.7782 3.58579 19.3834C3.21071 18.9886 3 18.4531 3 17.8947V11.5789V10.5263V6.31579C3 5.78947 3.2 5.26316 3.59 4.83158L4.38 3.98947L2.59 2.10526H0V0ZM8 3.15789V5.26316H14V3.15789H8ZM8.41 9.47368L6.41 7.36842H5V8.85263L7 10.9579V14.3053L5 16.4105V17.8947H6.41L8.41 15.7895H11.59L13.59 17.8947H15V16.4105L13 14.3053V10.9579L15 8.85263V7.36842H13.59L11.59 9.47368H8.41ZM9 11.5789H11V13.6842H9V11.5789Z" fill="white" fill-opacity="0.6" />
            </svg>
            <span id="speed-fuel">0 л</span>
        </div>
    </div>
</div>

<!-- ===== MAIN HUD ===== -->
<div id="modern-cefstudio" class="modern-cefstudio">
    <div class="top-logo-block">
        <img class="server-logo" src="icon/logotype.png" alt="logo">
        <div class="info-style"><span id="time">00:00</span></div>
        <div class="info-style"><span id="data">01.01.24</span></div>
        <div class="info-style"><span id="s1">Player</span></div>
        <div class="info-style info-style-id"><span id="s2">0</span></div>
    </div>

    <div class="weapon-block">
        <img id="weapon_id" class="weapon-png" src="icon/weapon/gun_0.png" alt="weapon">
        <div id="weapon_ammo" class="weapon-ammo"></div>
    </div>

    <div class="progress-bar-block">
        <div id="health-bar">
            <img class="bar-icon" src="icon/hp.svg" alt="hp">
            <div>
                <div id="b1" class="bar-indicator">100</div>
                <div class="bar-fill"></div>
            </div>
        </div>
        <div id="armour-bar">
            <img class="bar-icon" src="icon/armour.svg" alt="armour">
            <div>
                <div id="b3" class="bar-indicator">0</div>
                <div class="bar-fill armour"></div>
            </div>
        </div>
    </div>

    <div class="money-block">
        <div id="s3" class="money">
            <img src="icon/cash.svg" alt="cash" style="width:2.8vh; height:auto;">
            <span>0</span>
        </div>
    </div>
</div>

<style>
body { background: transparent; overflow: hidden; user-select: none; }
</style>

<!-- ============================================================ -->
<!-- JAVASCRIPT (всё в одном) -->
<!-- ============================================================ -->
<script>
// ----- БЛОКИРОВКА ВЫДЕЛЕНИЯ -----
document.ondragstart = test;
document.onselectstart = test;
document.oncontextmenu = test;
function test() { return false; }

// ----- ВАШ СКРИПТ: ПОВОРОТНИКИ (script.js) -----
var all_arrow = false;
var left_arrow = false;
var right_arrow = false;

document.addEventListener('keyup', function (event) {
    if (event.keyCode === 81) { // Q
        if (left_arrow == false) {
            document.getElementById("left-arrow").style = "animation: arrow 0.6s infinite;";
            document.getElementById("right-arrow").style = "animation: 0; animation-delay: 0;";
            left_arrow = true;
            right_arrow = false;
        } else {
            document.getElementById("left-arrow").style = "animation: 0; animation-delay: 0;";
            document.getElementById("right-arrow").style = "animation: 0; animation-delay: 0;";
            left_arrow = false;
            right_arrow = false;
        }
    }
});

document.addEventListener('keyup', function (event) {
    if (event.keyCode === 69) { // E
        if (right_arrow == false) {
            document.getElementById("right-arrow").style = "animation: arrow 0.6s infinite;";
            document.getElementById("left-arrow").style = "animation: 0; animation-delay: 0;";
            right_arrow = true;
            left_arrow = false;
        } else {
            document.getElementById("right-arrow").style = "animation: 0; animation-delay: 0;";
            document.getElementById("left-arrow").style = "animation: 0; animation-delay: 0;";
            right_arrow = false;
            left_arrow = false;
        }
    }
});

// ----- ВАШ СКРИПТ: ВРЕМЯ И ДАТА (time.js) -----
function zero_first_format(value) {
    return value < 10 ? '0' + value : value;
}

function dates() {
    var now = new Date();
    var day = zero_first_format(now.getDate());
    var month = zero_first_format(now.getMonth() + 1);
    var year = now.getFullYear();
    document.getElementById('data').innerHTML = day + "." + month + "." + year;
}

function times() {
    var now = new Date();
    var hours = zero_first_format(now.getHours());
    var minutes = zero_first_format(now.getMinutes());
    document.getElementById('time').innerHTML = hours + ":" + minutes;
}

setInterval(function () {
    dates();
    times();
}, 1000);

// ----- CEF СОБЫТИЯ (из script.js) -----
if (typeof cef !== 'undefined') {
    cef.on("modern:speed:arrow", (type) => {
        if (type == 0) {
            document.getElementById("left-arrow").style = "animation: 0; animation-delay: 0;";
            document.getElementById("right-arrow").style = "animation: 0; animation-delay: 0;";
        }
        if (type == 1) {
            document.getElementById("left-arrow").style = "animation: arrow 0.6s infinite;";
            document.getElementById("right-arrow").style = "animation: arrow 0.6s infinite;";
        }
    });

    cef.on("modern:speed:update", (odometer_val, gas_val) => {
        document.getElementById('speed-odometer').innerHTML = Math.round(odometer_val);
        document.getElementById('speed-fuel').innerHTML = `
            <svg class="fuel-icon" width="11" height="20" viewBox="0 0 17 20" fill="none">
                <path d="M0 0H3C3.28 0 3.53 0.115789 3.71 0.305263L5.79 2.50526L6.59 1.67368C7 1.26316 7.5 1.05263 8 1.05263H14C14.5 1.05263 15 1.26316 15.41 1.67368L17 3.33684V16.3263C17 18.3579 15.36 20 13.33 20H3.67C1.64 20 0 18.3579 0 16.3263V0ZM2 2V16.3263C2 17.2526 2.75 18 3.67 18H13.33C14.25 18 15 17.2526 15 16.3263V5L13.59 3.58947C13.43 3.43158 13.22 3.33684 13 3.33684H8.41L7.2 4.58947C6.83 4.96842 6.32 5.18947 5.79 5.18947L3 2.24211V2H2Z" fill="white"/>
            </svg> 
            ${Math.round(gas_val)} л.`;
    });

    cef.on('hud:update:playerinfo', (playername, playerid) => {
        if (document.getElementById('s1')) {
            document.getElementById('s1').innerText = `${playername}`;
        }
        if (document.getElementById('s2')) {
            document.getElementById('s2').innerText = `${playerid}`;
        }
    });
}

// ----- ОСНОВНОЙ СКРИПТ HUD -----
cef.emit("game:hud:setComponentVisible", "interface", false);
cef.emit("game:data:pollPlayerStats", true, 50);

cef.on("game:data:playerStats", (hp, max_hp, arm, breath, wanted, weapon, ammo, max_ammo, money, speed) => {
    document.getElementById('b1').innerHTML = Math.round(hp);
    document.getElementById('b3').innerHTML = Math.round(arm);
    document.getElementById('s3').innerHTML = `<img src="icon/cash.svg" style="width: 2.8vh; height: auto; filter: drop-shadow(0 0 8px rgba(255,215,0,0.3));"> ${formatt(money)}`;

    var weaponID = weapon;
    var weaponAmmo = '';
    if (weaponID !== '0') {
        weaponAmmo = `${ammo}/${(max_ammo - ammo)}`;
    }

    var speed_count = Math.round(speed * 1.4);
    document.getElementById("speed-count").innerHTML = `${speed_count}`;

    var meter_count = 838 + (speed * 3.77);
    document.getElementById("speed-meter").style = `stroke-dasharray: 838; stroke-dashoffset: -${meter_count};`;

    document.getElementById('weapon_id').src = `icon/weapon/gun_${weaponID}.png`;
    document.getElementById('weapon_ammo').innerHTML = weaponAmmo;
});

function formatt(i) {
    var text_fmt = `${i}`;
    var text_tmp = text_fmt;
    var text_len = text_fmt.length;
    var dots_count = 0;

    for (var idx = 0; idx < (text_len - 1); idx++) {
        if (text_tmp[idx] == '.') continue;
        if (((text_len - (idx + 1)) % 3) == 0) {
            dots_count++;
            text_tmp = text_tmp.slice(0, idx + dots_count) + '.' + text_tmp.slice(idx + dots_count);
        }
    }
    return text_tmp;
}

cef.on("modern:hud:visible", (type) => {
    if (type == 0) {
        document.getElementById('modern-cefstudio').style.visibility = 'hidden';
    }
    if (type == 1) {
        document.getElementById('modern-cefstudio').style.visibility = 'visible';
    }
});

cef.on("modern:hud:update", (b1, s1, s2) => {
    document.getElementById('b2').innerHTML = Math.round(b1);
    document.getElementById('s1').innerHTML = `${s1}`;
    document.getElementById('s2').innerHTML = `${s2}`;
});

cef.on("modern:speed:visible", () => {
    document.getElementById('modern-cefstudio-speed').style.visibility = 'visible';
});

cef.on("modern:speed:hidden", () => {
    document.getElementById('modern-cefstudio-speed').style.visibility = 'hidden';
});
</script>
</body>
</html>
