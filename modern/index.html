<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Classic HUD</title>
    <link href="https://fonts.googleapis.com/css?family=Montserrat:100,200,300,400,500,600,700" rel="stylesheet">
    <style>
        /* ===== RESET & BASE ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            user-select: none;
            background: transparent !important;
            font-family: 'Montserrat', sans-serif;
        }

        /* ===== HUD CONTAINER ===== */
        .classic-hud {
            position: relative;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            display: block;
        }

        /* ===== TOP RIGHT BLOCK ===== */
        .top-right-block {
            position: absolute;
            top: 0;
            right: 0;
            width: auto;
            height: auto;
        }

        /* ===== INFO CONTAINER ===== */
        .info-container {
            position: absolute;
            right: 0;
            top: 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 0.1vh;
            width: max-content;
            z-index: 10;
        }
        .info-style {
            display: inline-block;
            position: relative;
            text-align: right;
            font-size: 1.509vh;
            font-weight: 600;
            padding: 0.3268vh 1.7068vh 0.2068vh 1.7068vh;
            color: #171717;
            margin-left: 0.1vh;
            background: white;
            transform: skewX(23deg);
            z-index: 1;
            line-height: 1.4;
        }
        .info-style::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            transform: skewX(23deg);
            z-index: -1;
        }
        .info-style-id {
            background: #FFCC3F !important;
            padding: 0.3268vh 0.9068vh 0.2068vh 1.7068vh !important;
        }
        .info-style-id::before {
            background: #FFCC3F !important;
        }
        .info-style span {
            display: inline-block;
            transform: skewX(-23deg);
        }

        /* ===== LOGOTYPE ===== */
        .logotype {
            position: absolute;
            width: 25vh;
            top: 3.8vh;
            right: 8vh;
            opacity: 0.9;
            pointer-events: none;
            z-index: 10;
        }

        /* ===== WEAPON ===== */
        .weapon-container {
            position: absolute;
            top: 15vh;
            right: 22vh;
            display: flex;
            align-items: center;
            gap: 0.5vh;
            z-index: 10;
        }
        .weapon-icon {
            width: 10vh;
            height: auto;
            filter: drop-shadow(0 0 6px rgba(0,0,0,0.6));
            display: none;
        }
        .ammo-block {
            display: none;
            align-items: baseline;
            gap: 0.2vh;
            background: rgba(0,0,0,0.35);
            padding: 0.3vh 1.2vh 0.3vh 0.8vh;
            border-radius: 0.6vh;
            backdrop-filter: blur(2px);
        }
        .ammo {
            color: white;
            font-size: 2.2vh;
            font-weight: 600;
            font-style: italic;
            letter-spacing: 0.1vh;
        }
        .max-ammo {
            color: rgba(255,255,255,0.55);
            font-size: 1.8vh;
            font-weight: 500;
            font-style: italic;
        }

        /* ===== INDICATORS ===== */
        .right-indicator-container {
            position: absolute;
            top: 9vh;
            right: 0;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 1.2vh;
            width: 11vh;
            z-index: 10;
        }
        .right-indicator-block {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            width: 100%;
            height: 3.5vh;
        }
        .progress-indicator {
            position: absolute;
            right: 7.6vh;
            top: -1.8vh;
            color: white;
            font-size: 1.9vh;
            font-weight: 700;
            text-align: right;
            text-shadow: 0 0 8px rgba(0,0,0,0.7);
        }
        .right-indicator-icon {
            width: 2.5vh;
            height: 2.5vh;
            margin-right: 1.8vh;
            filter: drop-shadow(0 0 4px rgba(0,0,0,0.5));
        }
        .circle-progress-bg {
            stroke: none;
        }
        .circle-progress {
            stroke: #EE2746;
            stroke-width: 6.592px;
            stroke-dasharray: 251;
            stroke-dashoffset: 251;
            transition: stroke-dashoffset 0.5s ease;
        }
        .circle-progress-icon {
            width: 2.67vh;
            position: absolute;
            right: 5.6vh;
            top: 0.2vh;
            pointer-events: none;
        }
        .circle-progress-indicator {
            position: absolute;
            right: 11.7vh;
            top: 0.5vh;
            color: white;
            font-size: 2.3vh;
            font-weight: 700;
            text-align: center;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }
        .right-indicator-block svg {
            width: 3.6vh;
            height: 3.6vh;
            margin-right: 1.2vh;
            flex-shrink: 0;
        }

        /* ===== CASH ===== */
        .cash-container {
            position: absolute;
            right: 3.9vh;
            top: 29vh;
            display: flex;
            flex-direction: column;
            gap: 0.5vh;
            align-items: flex-end;
            z-index: 10;
        }
        .cash-block {
            display: flex;
            align-items: center;
            gap: 1vh;
            background: rgba(0,0,0,0.25);
            padding: 0.3vh 1.2vh 0.3vh 2vh;
            border-radius: 0.8vh;
            backdrop-filter: blur(2px);
        }
        .cash {
            color: white;
            font-size: 2vh;
            font-weight: 700;
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 0.05vh;
            min-width: 10vw;
            text-align: right;
        }
        .cash-block svg {
            width: 3vh;
            height: auto;
            filter: drop-shadow(0 0 4px rgba(0,0,0,0.4));
        }

        /* ===== LOCATION ===== */
        .city-street-block {
            display: flex;
            position: absolute;
            bottom: 5.7vh;
            left: 31.5vh;
            align-items: center;
            gap: 0.5vh;
            background: rgba(0,0,0,0.2);
            padding: 0.5vh 2vh 0.5vh 1.2vh;
            border-radius: 0.8vh;
            backdrop-filter: blur(3px);
            z-index: 10;
        }
        .city-street-block svg {
            width: 3vh;
            height: auto;
            filter: drop-shadow(0 0 4px rgba(0,0,0,0.3));
        }
        .city-street-name {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
        }
        .city-name {
            font-size: 1.7vh;
            font-weight: 600;
            color: white;
            text-shadow: 0 0 8px rgba(0,0,0,0.6);
        }
        .street-name {
            font-size: 1.5vh;
            font-weight: 500;
            color: white;
            text-shadow: 0 0 6px rgba(0,0,0,0.5);
        }

        @media (max-width: 768px) {
            .cash { min-width: 20vw; font-size: 1.6vh; }
            .weapon-container { right: 10vh; top: 12vh; }
            .weapon-icon { width: 8vh; }
            .info-style { font-size: 1.2vh; padding: 0.2vh 1vh; }
            .logotype { width: 18vh; top: 2.5vh; right: 4vh; }
            .city-street-block { left: 5vh; bottom: 3vh; }
        }
    </style>
</head>
<body>

<div id="hud" class="classic-hud">
    <div class="top-right-block">

        <!-- INFO -->
        <div class="info-container">
            <div class="info-style"><span id="time">00:00:00</span></div>
            <div class="info-style"><span id="date">01.01.24</span></div>
            <div class="info-style"><span id="player">Player</span></div>
            <div class="info-style info-style-id"><span id="playerid">0</span></div>
        </div>

        <!-- LOGOTYPE -->
        <svg class="logotype" viewBox="0 0 200 50" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="200" height="50" rx="10" fill="white" fill-opacity="0.1"/>
            <text x="100" y="32" font-size="20" font-weight="700" fill="white" text-anchor="middle">SERVER</text>
        </svg>

        <!-- WEAPON -->
        <div class="weapon-container">
            <img id="weapon_id" class="weapon-icon" src="" alt="weapon">
            <div id="weapon_ammo" class="ammo-block"></div>
        </div>

        <!-- INDICATORS -->
        <div class="right-indicator-container">
            <!-- Armour -->
            <div class="right-indicator-block">
                <p id="b3" class="progress-indicator">0</p>
                <svg id="armour-icon" class="right-indicator-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L3 7V13C3 19.2 7.2 24 12 24C16.8 24 21 19.2 21 13V7L12 2Z" fill="#555555" stroke="#888888" stroke-width="1"/>
                    <text x="12" y="18" font-size="10" font-weight="700" fill="white" text-anchor="middle">A</text>
                </svg>
            </div>

            <!-- Health -->
            <div class="right-indicator-block">
                <p id="b1" class="circle-progress-indicator">100</p>
                <svg viewBox="0 0 100 100" stroke-linecap="round" style="transform: rotate(-90deg);">
                    <circle class="circle-progress-bg" cx="50" cy="50" r="40" fill="rgba(0,0,0,0.4)" />
                    <circle id="circle-health" class="circle-progress" cx="50" cy="50" r="40" fill="none" />
                </svg>
                <svg class="circle-progress-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM12 20C7.59 20 4 16.41 4 12C4 7.59 7.59 4 12 4C16.41 4 20 7.59 20 12C20 16.41 16.41 20 12 20Z" fill="white" fill-opacity="0.5"/>
                    <path d="M12 6V12L16 14" stroke="white" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </div>

            <!-- Handcuffs -->
            <div class="right-indicator-block">
                <p id="handcuffs-text" class="progress-indicator"></p>
                <svg id="handcuffs-icon" class="right-indicator-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M8 8L8 16M16 8L16 16M6 8C6 5.79086 7.79086 4 10 4H14C16.2091 4 18 5.79086 18 8V12M6 16C6 18.2091 7.79086 20 10 20H14C16.2091 20 18 18.2091 18 16" stroke="#888888" stroke-width="2" stroke-linecap="round"/>
                    <circle cx="12" cy="12" r="2" fill="#888888"/>
                </svg>
            </div>
        </div>

        <!-- CASH -->
        <div class="cash-container">
            <div class="cash-block">
                <div id="s3" class="cash">0</div>
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2Z" fill="#FFD700"/>
                    <text x="12" y="16" font-size="10" font-weight="700" fill="#333" text-anchor="middle">$</text>
                </svg>
            </div>
            <div class="cash-block">
                <div id="card" class="cash">0</div>
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="2" y="5" width="20" height="14" rx="2" fill="#4CAF50"/>
                    <path d="M2 10H22" stroke="#333" stroke-width="1"/>
                    <text x="12" y="18" font-size="8" font-weight="700" fill="white" text-anchor="middle">BANK</text>
                </svg>
            </div>
        </div>
    </div>

    <!-- LOCATION -->
    <div class="city-street-block">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C8.13 2 5 5.13 5 9C5 14.25 12 22 12 22C12 22 19 14.25 19 9C19 5.13 15.87 2 12 2Z" fill="#FF4444" fill-opacity="0.8"/>
            <circle cx="12" cy="9" r="3" fill="white"/>
        </svg>
        <div class="city-street-name">
            <div id="city" class="city-name">г.Арзамас</div>
            <div id="street" class="street-name">ул.Пушкина 52</div>
        </div>
    </div>
</div>

<!-- ============================================================ -->
<!-- JAVASCRIPT (работает с вашим game:data:playerStats) -->
<!-- ============================================================ -->
<script>
    // ----- 1. ВАША ФУНКЦИЯ ФОРМАТИРОВАНИЯ ДЕНЕГ -----
    function formatt(i) {
        var text_fmt = String(i);
        var text_tmp = text_fmt;
        var text_len = text_fmt.length;
        var dots_count = 0;

        for (var idx = 0; idx < (text_len - 1); idx++) {
            if (text_tmp[idx] == '.') continue;
            if (((text_len - (idx + 1)) % 3) == 0) {
                dots_count++;
                text_tmp = text_tmp.slice(0, idx + dots_count) + '.' + text_tmp.slice(idx + dots_count);
            }
        }
        return text_tmp;
    }

    // ----- 2. ТАЙМЕР ВРЕМЕНИ (реальное) -----
    setInterval(function() {
        var d = new Date();
        document.getElementById('time').innerText = 
            String(d.getHours()).padStart(2,'0') + ':' +
            String(d.getMinutes()).padStart(2,'0') + ':' +
            String(d.getSeconds()).padStart(2,'0');
        document.getElementById('date').innerText = 
            String(d.getDate()).padStart(2,'0') + '.' +
            String(d.getMonth()+1).padStart(2,'0') + '.' +
            String(d.getFullYear()).slice(2);
    }, 1000);

    // ----- 3. ПОВОРОТНИКИ (Q / E) -----
    var leftArrow = false;
    var rightArrow = false;

    document.addEventListener('keyup', function(event) {
        if (event.keyCode === 81) { // Q
            var left = document.getElementById('left-arrow');
            var right = document.getElementById('right-arrow');
            if (!leftArrow) {
                left.className = 'left-arrow-anim active';
                right.className = 'right-arrow-anim';
                leftArrow = true;
                rightArrow = false;
            } else {
                left.className = 'left-arrow-anim';
                right.className = 'right-arrow-anim';
                leftArrow = false;
                rightArrow = false;
            }
        }
        if (event.keyCode === 69) { // E
            var left = document.getElementById('left-arrow');
            var right = document.getElementById('right-arrow');
            if (!rightArrow) {
                right.className = 'right-arrow-anim active';
                left.className = 'left-arrow-anim';
                rightArrow = true;
                leftArrow = false;
            } else {
                right.className = 'right-arrow-anim';
                left.className = 'left-arrow-anim';
                rightArrow = false;
                leftArrow = false;
            }
        }
    });

    // ----- 4. ПРИЁМ ДАННЫХ ОТ СЕРВЕРА (ВАШЕ СОБЫТИЕ) -----
    if (typeof cef !== 'undefined') {

        // Запрос данных (как в вашем примере)
        cef.emit("game:hud:setComponentVisible", "interface", false);
        cef.emit("game:data:pollPlayerStats", true, 50);

        // ВАШЕ ГЛАВНОЕ СОБЫТИЕ
        cef.on("game:data:playerStats", function(hp, max_hp, arm, breath, wanted, weapon, ammo, max_ammo, money, speed) {
            // Здоровье
            document.getElementById('b1').innerHTML = Math.round(hp);
            
            // Броня
            document.getElementById('b3').innerHTML = Math.round(arm);

            // Деньги (с вашей функцией форматирования)
            document.getElementById('s3').innerHTML = 
                `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:23px;height:23px;margin-top:-5px;margin-right:8px;">
                    <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2Z" fill="#FFD700"/>
                    <text x="12" y="16" font-size="10" font-weight="700" fill="#333" text-anchor="middle">$</text>
                </svg> ${formatt(money)}`;

            // Оружие
            var weaponID = weapon;
            var weaponAmmo = '';
            if (weaponID !== '0') {
                weaponAmmo = `${ammo}/${(max_ammo - ammo)}`;
            }
            document.getElementById('weapon_id').src = `icon/weapon/gun_${weaponID}.png`;
            document.getElementById('weapon_ammo').innerHTML = weaponAmmo;

            // Спидометр (если есть элементы)
            var speed_count = Math.round(speed * 1.4);
            if (document.getElementById("speed-count")) {
                document.getElementById("speed-count").innerHTML = speed_count;
            }
            if (document.getElementById("speed-meter")) {
                var meter_count = 838 + (speed * 3.77);
                document.getElementById("speed-meter").style = `stroke-dasharray: 838; stroke-dashoffset: -${meter_count};`;
            }
        });

        // ----- ДОПОЛНИТЕЛЬНЫЕ СОБЫТИЯ (если нужно) -----
        // Обновление ника и ID
        cef.on('hud:update:playerinfo', function(playername, playerid) {
            document.getElementById('player').innerText = playername || 'Player';
            document.getElementById('playerid').innerText = playerid || '0';
        });

        // Обновление локации
        cef.on('hud:update:location', function(city, street) {
            document.getElementById('city').innerText = city || 'г.Арзамас';
            document.getElementById('street').innerText = street || 'ул.Пушкина 52';
        });

        console.log('[HUD] Все CEF события подключены!');
    }

    // ----- 5. F7 — ВКЛ/ВЫКЛ HUD -----
    document.addEventListener('keydown', function(event) {
        if (event.key === 'F7') {
            var hud = document.getElementById('hud');
            hud.style.display = hud.style.display === 'none' ? 'block' : 'none';
            if (typeof cef !== 'undefined') {
                cef.emit('hud:toggle', hud.style.display === 'block');
            }
        }
    });

    console.log('[HUD] Ready! Press F7 to toggle.');
</script>
</body>
</html>
