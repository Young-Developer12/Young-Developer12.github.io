<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>MODERN HUD</title>
    <meta http-equiv='X-UA-Compatible' content='ie=edge'>
    <link rel="stylesheet" href="css/hud.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/5.0.0-alpha1/css/bootstrap.min.css">
    <style>
        /* ===== RESET ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            user-select: none;
            background: transparent !important;
            font-family: 'Montserrat', sans-serif;
        }

        /* ===== HUD CONTAINER ===== */
        .modern-cefstudio {
            position: relative;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            visibility: visible !important; /* ВСЕГДА ВИДЕН */
        }

        /* ===== TOP LOGO BLOCK ===== */
        .top-logo-block {
            position: absolute;
            top: 2vh;
            right: 2vh;
            display: flex;
            align-items: center;
            gap: 1.5vh;
            background: rgba(0,0,0,0.4);
            padding: 0.8vh 1.5vh;
            border-radius: 1vh;
            backdrop-filter: blur(4px);
        }
        .server-logo {
            height: 4vh;
            width: auto;
        }
        .time-block {
            display: flex;
            gap: 1vh;
            color: white;
            font-size: 1.8vh;
            font-weight: 600;
        }
        .time-icon {
            width: 2vh;
            height: 2vh;
        }
        .player-info-block {
            display: flex;
            gap: 1vh;
            color: white;
            font-size: 1.8vh;
            font-weight: 600;
        }
        .player-nick { color: #FFCC3F; }
        .player-id { color: #ffffff; }

        /* ===== WEAPON BLOCK ===== */
        .weapon-block {
            position: absolute;
            top: 12vh;
            right: 4vh;
            display: flex;
            align-items: center;
            gap: 1vh;
            background: rgba(0,0,0,0.35);
            padding: 0.5vh 1.5vh 0.5vh 1vh;
            border-radius: 1vh;
            backdrop-filter: blur(4px);
        }
        .weapon-png {
            width: 5vh;
            height: auto;
            filter: drop-shadow(0 0 6px rgba(0,0,0,0.5));
        }
        .weapon-ammo {
            color: white;
            font-size: 1.8vh;
            font-weight: 600;
        }

        /* ===== PROGRESS BARS ===== */
        .progress-bar-block {
            position: absolute;
            top: 18vh;
            right: 4vh;
            display: flex;
            flex-direction: column;
            gap: 1vh;
        }
        .progress-bar-block > div {
            display: flex;
            align-items: center;
            gap: 0.8vh;
            background: rgba(0,0,0,0.3);
            padding: 0.3vh 1vh 0.3vh 0.5vh;
            border-radius: 0.6vh;
            backdrop-filter: blur(3px);
            min-width: 12vh;
        }
        .bar-icon {
            width: 2.5vh;
            height: auto;
            filter: drop-shadow(0 0 4px rgba(0,0,0,0.4));
        }
        .bar-indicator {
            color: white;
            font-size: 1.8vh;
            font-weight: 700;
            min-width: 5vh;
            text-align: right;
        }

        /* ===== MONEY BLOCK ===== */
        .money-block {
            position: absolute;
            bottom: 4vh;
            right: 4vh;
            background: rgba(0,0,0,0.35);
            padding: 0.8vh 2vh 0.8vh 1.5vh;
            border-radius: 0.8vh;
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            gap: 0.5vh;
        }
        .money {
            color: white;
            font-size: 2.2vh;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5vh;
        }

        /* ===== SPEEDOMETER ===== */
        .modern-cefstudio-speed {
            position: absolute;
            bottom: 4vh;
            left: 4vh;
            visibility: visible !important; /* ВСЕГДА ВИДЕН */
        }
        .speed-bg {
            position: relative;
            width: 25vh;
            height: 25vh;
        }
        .speed-count {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 4vh;
            font-weight: 700;
            text-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        .speed-kmh {
            position: absolute;
            bottom: 3vh;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.5);
            font-size: 1.8vh;
            font-weight: 500;
        }
        .speed-meter {
            stroke: #FFCC3F;
            stroke-width: 8px;
            fill: none;
            transition: stroke-dashoffset 0.3s ease;
        }
        .speed-meter-bg {
            stroke: rgba(255,255,255,0.15);
            stroke-width: 8px;
            fill: none;
        }
        .arrow-icon {
            position: absolute;
            bottom: 1vh;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 1vh;
        }
        .arrow-icon svg {
            width: 2.5vh;
            height: 2vh;
        }
        .left-arrow-anim, .right-arrow-anim {
            fill: white;
            opacity: 0.3;
            transition: opacity 0.3s;
        }
        .left-arrow-anim.active, .right-arrow-anim.active {
            opacity: 1;
            animation: blink 0.6s infinite;
        }
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.2; }
            100% { opacity: 1; }
        }

        /* ===== FUEL ===== */
        .fuel-count {
            position: absolute;
            bottom: 1vh;
            right: 1vh;
            color: white;
            font-size: 1.6vh;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5vh;
        }
        .fuel-icon {
            width: 1.8vh;
            height: auto;
        }
        .odometr-block {
            position: absolute;
            bottom: 7vh;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.6);
            font-size: 1.4vh;
            font-weight: 500;
            text-align: center;
        }
    </style>
</head>
<body>

<!-- ===== SPEEDOMETER ===== -->
<div class="modern-cefstudio-speed" id="speed-container">
    <div class="speed-bg">
        <svg class="speed" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 167" stroke-linecap="round">
            <path class="speed-meter-bg" d="M41 149.5a77 77 0 1 1 117.93 0" fill="none" stroke-dasharray="4" />
            <path id="speed-meter" class="speed-meter" d="M41 149.5a77 77 0 1 1 117.93 0" fill="none" style="stroke-dasharray: 624.295, 504.295; stroke-dashoffset: 625;" />
        </svg>
        <div class="speed-content">
            <div id="speed-count" class="speed-count">0</div>
            <div class="speed-kmh">КМ/Ч</div>
        </div>
        <div class="arrow-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="17" height="10" viewBox="0 0 17 12" fill="none">
                <path id="left-arrow" class="left-arrow-anim" d="M6.09319 12V7.2H16.9634L17 4.788H6.09319V0L0 6L6.09319 12Z" fill="white" />
            </svg>
            <svg xmlns="http://www.w3.org/2000/svg" width="17" height="10" viewBox="0 0 17 12" fill="none">
                <path id="right-arrow" class="right-arrow-anim" d="M10.9068 -5.32684e-07L10.9068 4.8L0.0365607 4.8L4.1858e-07 7.212L10.9068 7.212L10.9068 12L17 6L10.9068 -5.32684e-07Z" fill="white" />
            </svg>
        </div>
        <div class="odometr-block">
            <div id="speed-odometer" class="speed-odometer">000000</div>
        </div>
        <div class="fuel-count">
            <svg class="fuel-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 17 20" fill="none">
                <path d="M0 0H3C3.28 0 3.53 0.115789 3.71 0.305263L5.79 2.50526L6.59 1.67368C7 1.26316 7.5 1.05263 8 1.05263H14C14.5 1.05263 15 1.26316 15.41 1.67368L16.41 2.72632C16.8 3.1579 17 3.68421 17 4.21053V17.8947C17 18.4531 16.7893 18.9886 16.4142 19.3834C16.0391 19.7782 15.5304 20 15 20H5C4.46957 20 3.96086 19.7782 3.58579 19.3834C3.21071 18.9886 3 18.4531 3 17.8947V11.5789V10.5263V6.31579C3 5.78947 3.2 5.26316 3.59 4.83158L4.38 3.98947L2.59 2.10526H0V0ZM8 3.15789V5.26316H14V3.15789H8ZM8.41 9.47368L6.41 7.36842H5V8.85263L7 10.9579V14.3053L5 16.4105V17.8947H6.41L8.41 15.7895H11.59L13.59 17.8947H15V16.4105L13 14.3053V10.9579L15 8.85263V7.36842H13.59L11.59 9.47368H8.41ZM9 11.5789H11V13.6842H9V11.5789Z" fill="white" fill-opacity="0.6" />
            </svg>
            <span id="speed-fuel">0 л</span>
        </div>
    </div>
</div>

<!-- ===== MAIN HUD ===== -->
<div id="modern-cefstudio" class="modern-cefstudio">
    <div class="top-logo-block">
        <img class="server-logo" src="icon/logotype.png" alt="logo">
        <div class="time-block">
            <svg class="time-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 14 14" fill="none">
                <circle cx="7" cy="7" r="6.5" stroke="white" />
                <path d="M9 9L7 7" stroke="white" stroke-linecap="round" />
                <path d="M7.5 4C7.5 3.72386 7.27614 3.5 7 3.5C6.72386 3.5 6.5 3.72386 6.5 4L7.5 4ZM6.5 4L6.5 7L7.5 7L7.5 4L6.5 4Z" fill="white" />
            </svg>
            <div id="time">00:00</div>
            <div id="data">01.01.24</div>
        </div>
        <div class="player-info-block">
            <div id="s1" class="player-nick">-</div>
            <div id="s2" class="player-id">-</div>
        </div>
    </div>

    <div class="weapon-block">
        <img id="weapon_id" class="weapon-png" src="icon/weapon/gun_0.png" alt="weapon">
        <div id="weapon_ammo" class="weapon-ammo"></div>
    </div>

    <div class="progress-bar-block">
        <div id="health-bar">
            <img class="bar-icon" src="icon/hp.svg" alt="hp">
            <div id="b1" class="bar-indicator">100</div>
        </div>
        <div id="armour-bar">
            <img class="bar-icon" src="icon/armour.svg" alt="armour">
            <div id="b3" class="bar-indicator">0</div>
        </div>
    </div>

    <div class="money-block">
        <div id="s3" class="money">
            <img src="icon/cash.svg" alt="cash" style="width:2.5vh; height:auto;">
            <span>0</span>
        </div>
    </div>
</div>

<!-- ============================================================ -->
<!-- JAVASCRIPT (всё в одном) -->
<!-- ============================================================ -->
<script>
    // ===== 1. ФОРМАТИРОВАНИЕ ДЕНЕГ (как в примере) =====
    function formatMoney(val) {
        if (val === undefined || val === null) return '0';
        var s = String(val).replace(/,/g,'');
        var len = s.length;
        var dots = 0;
        for (var i = 0; i < len; i++) {
            if ((len - i) % 3 === 0 && i > 0) {
                s = s.slice(0, i + dots) + '.' + s.slice(i + dots);
                dots++;
            }
        }
        return s;
    }

    // ===== 2. ТАЙМЕР ВРЕМЕНИ (реальное) =====
    setInterval(function() {
        var d = new Date();
        document.getElementById('time').innerText = 
            String(d.getHours()).padStart(2,'0') + ':' +
            String(d.getMinutes()).padStart(2,'0');
        document.getElementById('data').innerText = 
            String(d.getDate()).padStart(2,'0') + '.' +
            String(d.getMonth()+1).padStart(2,'0') + '.' +
            String(d.getFullYear()).slice(2);
    }, 1000);

    // ===== 3. ПОВОРОТНИКИ (Q / E) =====
    var leftArrow = false;
    var rightArrow = false;

    document.addEventListener('keyup', function(event) {
        if (event.keyCode === 81) { // Q
            var left = document.getElementById('left-arrow');
            var right = document.getElementById('right-arrow');
            if (!leftArrow) {
                left.className = 'left-arrow-anim active';
                right.className = 'right-arrow-anim';
                leftArrow = true;
                rightArrow = false;
            } else {
                left.className = 'left-arrow-anim';
                right.className = 'right-arrow-anim';
                leftArrow = false;
                rightArrow = false;
            }
        }
        if (event.keyCode === 69) { // E
            var left = document.getElementById('left-arrow');
            var right = document.getElementById('right-arrow');
            if (!rightArrow) {
                right.className = 'right-arrow-anim active';
                left.className = 'left-arrow-anim';
                rightArrow = true;
                leftArrow = false;
            } else {
                right.className = 'right-arrow-anim';
                left.className = 'left-arrow-anim';
                rightArrow = false;
                leftArrow = false;
            }
        }
    });

    // ===== 4. ПРИЁМ ДАННЫХ ОТ СЕРВЕРА (CEF) =====
    if (typeof cef !== 'undefined') {

        // Включение/выключение HUD (можно не использовать, он всегда виден)
        cef.on('modern:hud:visible', function(type) {
            // Оставлено для совместимости, но не влияет
        });

        // Обновление ника и ID
        cef.on('modern:hud:update', function(b1, s1, s2) {
            document.getElementById('s1').innerText = s1 || '-';
            document.getElementById('s2').innerText = s2 || '-';
        });

        // Главное обновление (как в примере)
        cef.on('game:data:playerStats', function(hp, max_hp, arm, breath, wanted, weapon, ammo, max_ammo, money, speed) {
            // Здоровье
            document.getElementById('b1').innerText = Math.round(hp);
            // Броня
            document.getElementById('b3').innerText = Math.round(arm);
            // Деньги
            document.getElementById('s3').innerHTML = 
                `<img src="icon/cash.svg" alt="cash" style="width:2.5vh;height:auto;"> ${formatMoney(money)}`;

            // Оружие
            var weaponID = weapon;
            var weaponAmmo = '';
            if (weaponID !== '0' && weaponID !== '1') {
                weaponAmmo = `${ammo}/${(max_ammo - ammo)}`;
                document.getElementById('weapon_id').src = `icon/weapon/gun_${weaponID}.png`;
                document.getElementById('weapon_id').style.display = 'block';
                document.getElementById('weapon_ammo').innerText = weaponAmmo;
                document.getElementById('weapon_ammo').style.display = 'block';
            } else {
                document.getElementById('weapon_id').style.display = 'none';
                document.getElementById('weapon_ammo').style.display = 'none';
            }

            // Спидометр
            var speedCount = Math.round(speed * 1.4);
            document.getElementById('speed-count').innerText = speedCount;

            // Обновление круга спидометра
            var meterCount = 838 + (speed * 3.77);
            document.getElementById('speed-meter').style = 
                `stroke-dasharray: 838; stroke-dashoffset: -${meterCount};`;
        });

        // Спидометр видимость (всегда виден)
        cef.on('modern:speed:visible', function() {
            // Уже виден
        });
        cef.on('modern:speed:hidden', function() {
            // Не скрываем
        });

        // Обновление пробега и бензина
        cef.on('modern:speed:update', function(odometer, fuel) {
            document.getElementById('speed-odometer').innerText = String(odometer).padStart(6, '0');
            document.getElementById('speed-fuel').innerText = `${Math.round(fuel)} л`;
        });

        // Поворотники от сервера (аварийка)
        cef.on('modern:speed:arrow', function(type) {
            var left = document.getElementById('left-arrow');
            var right = document.getElementById('right-arrow');
            if (type == 0) {
                left.className = 'left-arrow-anim';
                right.className = 'right-arrow-anim';
            }
            if (type == 1) {
                left.className = 'left-arrow-anim active';
                right.className = 'right-arrow-anim active';
            }
        });

        console.log('[HUD] Все CEF события подключены!');
    }

    // ===== 5. F7 — ВКЛ/ВЫКЛ HUD (теперь просто скрывает) =====
    document.addEventListener('keydown', function(event) {
        if (event.key === 'F7') {
            var hud = document.getElementById('modern-cefstudio');
            var speed = document.getElementById('speed-container');
            if (hud.style.visibility === 'hidden') {
                hud.style.visibility = 'visible';
                speed.style.visibility = 'visible';
            } else {
                hud.style.visibility = 'hidden';
                speed.style.visibility = 'hidden';
            }
            if (typeof cef !== 'undefined') {
                cef.emit('hud:toggle', hud.style.visibility === 'visible');
            }
        }
    });

    console.log('[HUD] Ready! Press F7 to toggle.');
</script>
</body>
</html>
