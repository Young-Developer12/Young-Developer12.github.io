<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Авторизация</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="auth-container" class="auth-container">
    <div class="auth-overlay"></div>

    <div class="auth-wrapper">
        <div class="auth-header">
            <div class="auth-title">ELEGANT <span>ROLEPLAY</span></div>
        </div>

        <!-- Основная форма -->
        <div class="auth-form">
            <!-- Вкладки Вход / Регистрация -->
            <div class="auth-tabs">
                <div class="auth-tab active" data-tab="login">Вход</div>
                <div class="auth-tab" data-tab="register">Регистрация</div>
            </div>

            <!-- ===== ФОРМА ВХОДА ===== -->
            <div id="auth-login" class="auth-tab-content active">
                <div class="auth-field">
                    <label>Ваш никнейм</label>
                    <input type="text" id="login-username" placeholder="Введите никнейм..." maxlength="24">
                </div>
                <div class="auth-field">
                    <label>Пароль</label>
                    <input type="password" id="login-password" placeholder="Введите пароль..." maxlength="16">
                </div>
                <button class="auth-btn" id="login-btn">Войти</button>
                <div class="auth-error" id="login-error"></div>
            </div>

            <!-- ===== ФОРМА РЕГИСТРАЦИИ ===== -->
            <div id="auth-register" class="auth-tab-content">
                <div class="auth-field">
                    <label>Ваш никнейм</label>
                    <input type="text" id="reg-username" placeholder="Введите никнейм..." maxlength="24">
                </div>
                <div class="auth-field">
                    <label>Пароль</label>
                    <input type="password" id="reg-password" placeholder="Введите пароль..." maxlength="16">
                </div>
                <div class="auth-field">
                    <label>Подтверждение пароля</label>
                    <input type="password" id="reg-password-confirm" placeholder="Повторите пароль..." maxlength="16">
                </div>
                <div class="auth-field">
                    <label>Электронная почта</label>
                    <input type="text" id="reg-email" placeholder="example@mail.ru" maxlength="25">
                </div>
                <button class="auth-btn" id="register-btn">Зарегистрироваться</button>
                <div class="auth-error" id="register-error"></div>
            </div>

            <!-- ===== ВЫБОР СКИНА (появляется после регистрации) ===== -->
            <div id="skin-selection" class="skin-selection" style="display:none;">
                <div class="skin-title-block">Выберите скин</div>
                <div class="skin-options" id="skin-options">
                    <!-- Карточки скинов будут созданы через JS -->
                </div>
                <button class="skin-save-btn" id="save-skin">Сохранить скин</button>
                <div class="auth-error" id="skin-error"></div>
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
